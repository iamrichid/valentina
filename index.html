<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You | Ghana Special</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,300;1,500;1,600&family=Montserrat:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root { --rose-primary: #FB7185; --rose-soft: #FFF9F9; --text-main: #1A1A1A; }
        body { font-family: 'Montserrat', sans-serif; background-color: var(--rose-soft); color: var(--text-main); margin: 0; overflow: hidden; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .font-elegant { font-family: 'Cormorant Garamond', serif; }
        .setup-input { background: transparent; border-bottom: 2px solid #E5E5E5; padding: 12px 0; outline: none; font-family: 'Cormorant Garamond', serif; font-size: 2.2rem; width: 100%; text-align: center; }
        .btn-choice { padding: 10px 16px; border: 1px solid #E5E5E5; border-radius: 50px; font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; transition: 0.3s; }
        .btn-choice.active { background: var(--rose-primary); color: white; border-color: var(--rose-primary); }
        #heart-trigger { font-size: 7rem; cursor: pointer; filter: drop-shadow(0 0 15px rgba(251, 113, 133, 0.4)); -webkit-tap-highlight-color: transparent; position: relative; z-index: 999; }
        .falling-petal { position: fixed; top: -5vh; pointer-events: none; z-index: 1; animation: fall linear forwards; opacity: 0.6; }
        @keyframes fall { to { transform: translateY(105vh) rotate(360deg); } }
        #petal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 100; display: grid; grid-template-columns: repeat(10, 1fr); grid-template-rows: repeat(10, 1fr); }
        .overlay-petal { background: var(--rose-primary); border-radius: 50% 0 50% 50%; opacity: 0; }
        .hidden { display: none !important; }
        .lyrics-text { font-size: 2.5rem; line-height: 1.3; color: #1A1A1A; padding: 0 20px; }
        @media (max-width: 640px) { .lyrics-text { font-size: 1.8rem; } #heart-trigger { font-size: 5.5rem; } }
    </style>
</head>

<body>

    <div id="petal-overlay"></div>
    
    <audio id="bg-music" loop>
        <source src="https://www.bensound.com/bensound-music/bensound-love.mp3" type="audio/mpeg">
    </audio>

    <div id="setup-view" class="z-20 w-full max-w-md px-8 flex flex-col gap-10 text-center">
        <h1 class="text-4xl font-elegant italic font-bold">The Love Lab</h1>
        <p class="text-[10px] uppercase tracking-[0.3em] text-gray-400 -mt-6">Design a digital gift</p>
        
        <input type="text" id="target-name" class="setup-input" placeholder="Enter Their Name">
        
        <div class="flex flex-col gap-4">
            <p class="text-[10px] uppercase tracking-[0.2em] text-gray-500 font-bold">Vibe</p>
            <div class="flex flex-wrap justify-center gap-2">
                <button onclick="setRel('lover')" id="rel-lover" class="btn-choice active">Lover</button>
                <button onclick="setRel('crush')" id="rel-crush" class="btn-choice">Crush</button>
                <button onclick="setRel('friend')" id="rel-friend" class="btn-choice">Friend</button>
                <button onclick="setRel('enemy')" id="rel-enemy" class="btn-choice">Enemy</button>
            </div>
        </div>

        <button id="gen-btn" class="mt-4 py-5 bg-black text-white rounded-full text-[11px] tracking-[0.4em] uppercase font-bold shadow-2xl">Copy Special Link</button>
        <p id="copy-status" class="text-[10px] text-rose-500 font-bold uppercase tracking-widest opacity-0">Link Copied! WhatsApp it to them.</p>
    </div>

    <div id="experience-wrapper" class="hidden relative z-10 w-full px-8 text-center">
        <div id="intro-view" class="flex flex-col items-center gap-14">
            <h1 class="text-5xl font-elegant italic font-light text-gray-800" id="intro-title"></h1>
            <button id="read-btn" class="text-[13px] tracking-[0.5em] uppercase border-b-2 border-rose-300 pb-2 text-rose-500 font-black">Open Note</button>
        </div>

        <div id="question-view" class="hidden flex flex-col items-center gap-14 opacity-0">
            <h1 id="question-text" class="lyrics-text font-elegant italic font-medium min-h-[220px] flex items-center justify-center"></h1>
            <div id="buttons-container" class="hidden flex gap-12 w-full justify-center items-center">
                <button id="yes-btn" class="text-[18px] tracking-[0.2em] uppercase text-rose-500 font-black transition-all">Yes</button>
                <button id="no-btn" class="text-[14px] tracking-[0.2em] uppercase text-gray-300 font-bold transition-all">No</button>
            </div>
            <button id="next-msg-btn" class="text-[13px] tracking-[0.4em] uppercase text-rose-400 font-bold">Continue →</button>
        </div>

        <div id="success-view" class="hidden flex flex-col items-center gap-10 opacity-0">
            <div id="heart-trigger">❤️</div>
            <div class="h-32 flex items-center justify-center">
                <p id="final-message" class="text-3xl font-elegant italic text-gray-700 px-2"></p>
            </div>
            <div class="flex flex-col gap-6 mt-8">
                <p id="footer-note" class="text-[11px] tracking-[0.4em] uppercase text-gray-300">Every tap is a promise</p>
                <button onclick="location.href=location.pathname" class="text-[10px] tracking-[0.3em] uppercase text-rose-400 border border-rose-100 px-6 py-2 rounded-full">Create Your Own</button>
            </div>
        </div>
    </div>

    <script>
        const themes = {
            lover: {
                messages: ["“Obi doba, m'ani agye wo ho.”", "Chale, your love sweet pass Ghana Jollof.", "You are my Black Star—the brightest light.", "I want to build a world with only you.", "Will you be my Valentine?"],
                success: ["You are my blessing.", "You are my home.", "Forever yours.", "I love you truly."]
            },
            crush: {
                messages: ["I’ve been shy to say this...", "Every time I see you, my heart skip beat.", "You be the only vibe I’m feeling lately.", "Could we be more than friends?", "Will you be my Valentine?"],
                success: ["I'm glad I said it.", "You make me smile.", "Let's see where this goes.", "You're special."]
            },
            friend: {
                messages: ["Real ones are hard to find.", "Glad we're on the same vibe.", "Thank you for being there.", "You make life much more fun.", "Will you be my Bestie forever?"],
                success: ["Friends for life.", "Always got your back.", "To many more vibes.", "You're a gem."]
            },
            enemy: {
                messages: ["I know you dey watch me like DSTV.", "Your eye-red no fit stop my grace.", "Even Shatta Wale say: 'My enemies shame.'", "I'm the one God blessed. Agree?"],
                success: ["Victory is mine.", "Keep watching the glory.", "Psalm 23:5 always."]
            }
        };

        let config = { name: "", type: "lover" };
        let msgIndex = 0, flowIndex = 0, yesScale = 1;

        window.onload = () => {
            const params = new URLSearchParams(window.location.search);
            if (params.has('name')) {
                config.name = params.get('name');
                config.type = params.get('type') || 'lover';
                startExperience();
            }
            setInterval(createPetal, 450);
        };

        function setRel(t) {
            config.type = t;
            document.querySelectorAll('.btn-choice').forEach(b => b.classList.remove('active'));
            document.getElementById(`rel-${t}`).classList.add('active');
        }

        document.getElementById('gen-btn').onclick = () => {
            const name = document.getElementById('target-name').value || "Someone";
            const url = `${window.location.origin}${window.location.pathname}?name=${encodeURIComponent(name)}&type=${config.type}`;
            navigator.clipboard.writeText(url).then(() => {
                document.getElementById('copy-status').style.opacity = 1;
                setTimeout(() => document.getElementById('copy-status').style.opacity = 0, 3000);
            });
        };

        function startExperience() {
            document.getElementById('setup-view').classList.add('hidden');
            document.getElementById('experience-wrapper').classList.remove('hidden');
            document.getElementById('intro-title').innerText = `A note for ${config.name}.`;
        }

        document.getElementById('read-btn').onclick = () => {
            document.getElementById('bg-music').play().catch(() => {});
            anime({ targets: '#intro-view', opacity: 0, duration: 600, complete: () => {
                document.getElementById('intro-view').classList.add('hidden');
                document.getElementById('question-view').classList.remove('hidden');
                showNext();
                anime({ targets: '#question-view', opacity: 1, translateY: [20, 0], duration: 800 });
            }});
        };

        function showNext() {
            const list = themes[config.type].messages;
            document.getElementById('question-text').innerText = list[msgIndex];
            if (msgIndex === list.length - 1) {
                document.getElementById('next-msg-btn').classList.add('hidden');
                document.getElementById('buttons-container').classList.remove('hidden');
            }
        }

        document.getElementById('next-msg-btn').onclick = () => {
            msgIndex++; showNext();
            anime({ targets: '#question-text', opacity: [0, 1], duration: 400 });
        };

        document.getElementById('no-btn').onclick = function() {
            yesScale += 0.5;
            document.getElementById('yes-btn').style.transform = `scale(${yesScale})`;
            this.style.opacity = parseFloat(this.style.opacity || 1) - 0.2;
            this.style.transform = `translateX(${Math.random() * 20 - 10}px)`;
            if(yesScale > 4) this.classList.add('hidden');
        };

        document.getElementById('yes-btn').onclick = () => {
            const overlay = document.getElementById('petal-overlay');
            overlay.innerHTML = '';
            for(let i=0; i<100; i++) {
                const p = document.createElement('div'); 
                p.className = 'overlay-petal w-full h-full';
                overlay.appendChild(p);
            }
            anime({ 
                targets: '.overlay-petal', scale: [0, 1.2], opacity: [0, 1], duration: 800, delay: anime.stagger(15, {grid:[10,10], from:'center'}),
                complete: () => {
                    document.getElementById('question-view').classList.add('hidden');
                    document.getElementById('success-view').classList.remove('hidden');
                    document.getElementById('success-view').style.opacity = 1;
                    document.getElementById('final-message').innerText = `Tap the heart, ${config.name}...`;
                    anime({ targets: '#petal-overlay', opacity: 0, duration: 800, delay: 400, complete: () => document.getElementById('petal-overlay').classList.add('hidden') });
                }
            });
        };

        document.getElementById('heart-trigger').onclick = () => {
            const list = themes[config.type].success;
            const msgEl = document.getElementById('final-message');
            anime({ targets: '#heart-trigger', scale: [1, 1.3, 1], duration: 400 });
            for(let i=0; i<3; i++) createPetal();
            anime({ targets: msgEl, opacity: 0, duration: 300, complete: () => {
                msgEl.innerText = list[flowIndex];
                flowIndex = (flowIndex + 1) % list.length;
                anime({ targets: msgEl, opacity: 1, duration: 600 });
            }});
        };

        function createPetal() {
            const p = document.createElement('div');
            p.innerHTML = Math.random() > 0.5 ? '🌸' : '🌹'; 
            p.className = 'falling-petal';
            p.style.left = Math.random() * 100 + 'vw';
            p.style.fontSize = (Math.random() * 12 + 18) + 'px';
            const d = Math.random() * 5 + 5;
            p.style.animationDuration = d + 's';
            document.body.appendChild(p);
            setTimeout(() => p.remove(), d * 1000);
        }
    </script>
</body>
</html>
