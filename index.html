<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,300;1,500;1,600&family=Montserrat:wght@200;300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --rose-primary: #FB7185;
            --rose-soft: #FFF9F9;
            --text-main: #2C2C2C;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--rose-soft);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            letter-spacing: 0.05em;
        }

        .font-elegant {
            font-family: 'Cormorant Garamond', serif;
            font-variant-ligatures: common-ligatures;
        }

        /* Responsive Grid Styling */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            width: 100%;
            max-width: 300px;
            margin: 0 auto;
        }

        .grid-item {
            aspect-ratio: 1/1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #FFFFFF;
            border-radius: 50%; /* Soft circles for minimalism */
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 1.4rem;
            color: var(--rose-primary);
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(251, 113, 133, 0.15);
        }

        .grid-item:active {
            transform: scale(0.9);
            background-color: var(--rose-soft);
        }

        /* Falling Petals */
        .falling-petal {
            position: fixed;
            top: -5vh;
            pointer-events: none;
            z-index: 1;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to { transform: translateY(105vh) rotate(360deg); }
        }

        /* Petal Transition Overlay */
        #petal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 100;
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            grid-template-rows: repeat(10, 1fr);
        }

        .overlay-petal {
            background: var(--rose-primary);
            transform: scale(0);
            border-radius: 50% 0 50% 50%;
        }

        /* Minimalist Modal */
        #card-display {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            z-index: 150;
            opacity: 0;
            pointer-events: none;
            width: 85%;
            max-width: 320px;
            background: white;
            padding: 40px 25px;
            border-radius: 2px; /* Sharp, modern minimalism */
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            text-align: center;
            border-top: 3px solid var(--rose-primary);
        }

        .hidden { display: none !important; }

        /* Typography spacing fix */
        .line-height-extra {
            line-height: 1.8;
        }
    </style>
</head>

<body class="flex flex-col items-center justify-center">

    <iframe src="https://www.youtube.com/embed/P6yL6E_T7wM?autoplay=1&loop=1&playlist=P6yL6E_T7wM" class="hidden" allow="autoplay"></iframe>

    <div id="petal-overlay"></div>

    <div id="main-content" class="relative z-10 w-full px-10 text-center">
        
        <div id="initial-view" class="flex flex-col items-center gap-10">
            <h1 class="text-4xl md:text-5xl font-elegant italic font-light tracking-wide text-gray-800">
                A handwritten note.
            </h1>
            <button id="open-btn" class="text-[10px] tracking-[0.4em] uppercase border-b border-rose-300 pb-1 text-rose-400 hover:text-rose-600 transition-all">
                Read Message
            </button>
        </div>

        <div id="question-view" class="hidden flex-col items-center gap-12 opacity-0">
            <h1 id="question-text" class="text-2xl md:text-3xl font-elegant italic font-medium text-gray-700 line-height-extra min-h-[160px]"></h1>
            
            <div id="buttons-container" class="hidden flex gap-8 w-full justify-center">
                <button id="yes-btn" class="text-[11px] tracking-[0.3em] uppercase text-rose-500 font-semibold">Yes</button>
                <button id="no-btn" class="text-[11px] tracking-[0.3em] uppercase text-gray-300">No</button>
            </div>

            <button id="next-msg-btn" class="text-[10px] tracking-[0.4em] uppercase text-rose-300">
                Continue
            </button>
        </div>

        <div id="success-view" class="hidden flex-col items-center gap-10 opacity-0 w-full">
            <h1 class="text-lg font-elegant italic text-gray-400">Pick a moment</h1>
            <div class="grid-container">
                <div class="grid-item" onclick="showMessage(0)">i</div>
                <div class="grid-item" onclick="showMessage(1)">ii</div>
                <div class="grid-item" onclick="showMessage(2)">iii</div>
                <div class="grid-item" onclick="showMessage(3)">iv</div>
                <div class="grid-item" onclick="showMessage(4)">v</div>
                <div class="grid-item" onclick="showMessage(5)">vi</div>
            </div>
        </div>
    </div>

    <div id="card-display">
        <p id="card-text" class="text-xl font-elegant italic text-gray-600 line-height-extra"></p>
        <button onclick="closeCard()" class="mt-10 text-[9px] tracking-[0.5em] uppercase text-gray-300 hover:text-rose-400">Back</button>
    </div>

    <script>
        const loveMessages = [
            "“Obi doba, m'ani agye wo ho.” You are the only one who truly understands my soul.",
            "If love was a song, you'd be my favorite melody, the one I'd play on repeat forever.",
            "Chale, they say Jollof is sweet, but your love is the only thing that satisfies my heart.",
            "You are my Black Star—the brightest light in my sky, guiding me home.",
            "I don’t just want to be with you; I want to build a world with only you.",
            "Will you be my Valentine?"
        ];

        const noTexts = ["Are you sure?", "Think about it again.", "Look me in the eyes.", "..."];
        const secretMessages = ["You are my blessing.", "You are my gift.", "You are my favorite view.", "I choose you always.", "You are my home.", "I love you truly."];

        let messageIndex = 0;
        let noCount = 0;

        function createPetal() {
            const petal = document.createElement('div');
            petal.innerHTML = Math.random() > 0.5 ? '🌸' : '🌹';
            petal.className = 'falling-petal';
            petal.style.left = Math.random() * 100 + 'vw';
            petal.style.fontSize = (Math.random() * 10 + 10) + 'px';
            const duration = Math.random() * 5 + 4;
            petal.style.animationDuration = duration + 's';
            petal.style.opacity = Math.random() * 0.5 + 0.2;
            document.body.appendChild(petal);
            setTimeout(() => petal.remove(), duration * 1000);
        }
        setInterval(createPetal, 400);

        document.getElementById('open-btn').addEventListener('click', () => {
            anime({
                targets: '#initial-view',
                opacity: 0, translateY: -10, duration: 800,
                complete: () => {
                    document.getElementById('initial-view').classList.add('hidden');
                    document.getElementById('question-view').classList.remove('hidden');
                    updateMessage();
                    anime({ targets: '#question-view', opacity: 1, translateY: [10, 0], duration: 1000 });
                }
            });
        });

        function updateMessage() {
            document.getElementById('question-text').innerText = loveMessages[messageIndex];
            if (messageIndex === loveMessages.length - 1) {
                document.getElementById('next-msg-btn').classList.add('hidden');
                document.getElementById('buttons-container').classList.remove('hidden');
            }
        }

        document.getElementById('next-msg-btn').addEventListener('click', () => {
            messageIndex++;
            updateMessage();
            anime({ targets: '#question-text', opacity: [0, 1], duration: 800, easing: 'easeOutQuad' });
        });

        document.getElementById('no-btn').addEventListener('click', () => {
            if (noCount < noTexts.length) {
                document.getElementById('question-text').innerText = noTexts[noCount];
                noCount++;
            } else {
                document.getElementById('question-text').innerText = "I'll always be here.";
                document.getElementById('buttons-container').classList.add('hidden');
            }
        });

        document.getElementById('yes-btn').addEventListener('click', () => {
            const overlay = document.getElementById('petal-overlay');
            for(let i=0; i<100; i++) {
                const p = document.createElement('div');
                p.className = 'overlay-petal';
                overlay.appendChild(p);
            }
            
            anime({
                targets: '.overlay-petal',
                scale: [0, 1.1],
                duration: 900,
                delay: anime.stagger(20, {grid: [10, 10], from: 'center'}),
                complete: () => {
                    document.getElementById('question-view').classList.add('hidden');
                    document.getElementById('success-view').classList.remove('hidden');
                    document.getElementById('success-view').style.opacity = 1;
                    anime({ targets: '.overlay-petal', opacity: 0, duration: 800, delay: 200 });
                }
            });
        });

        function showMessage(idx) {
            document.getElementById('card-text').innerText = secretMessages[idx];
            const modal = document.getElementById('card-display');
            modal.style.pointerEvents = 'auto';
            anime({ targets: '#card-display', opacity: 1, translateY: [20, 0], scale: [0.95, 1], duration: 600 });
        }

        function closeCard() {
            const modal = document.getElementById('card-display');
            modal.style.pointerEvents = 'none';
            anime({ targets: '#card-display', opacity: 0, translateY: 20, duration: 400 });
        }
    </script>
</body>
</html>
