<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You | My Valentine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:ital,wght@1,400&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #FFF5F5;
            color: #1A1A1A;
            overflow-x: hidden;
            overscroll-behavior: none;
        }

        .font-serif { font-family: 'Playfair Display', serif; }

        /* Minimalist Grid Item */
        .grid-item {
            aspect-ratio: 1/1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            border: 1px solid #FFE4E6;
            border-radius: 12px;
            font-size: 1.5rem;
            color: #FB7185;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .grid-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgba(251, 113, 133, 0.2);
            border-color: #FB7185;
        }

        /* Petal Overlay Animation */
        #petal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 100;
            display: flex; flex-wrap: wrap;
        }

        .petal-transition {
            width: 10vw; height: 10vh;
            background: #FB7185;
            transform: scale(0);
            border-radius: 50% 0 50% 50%; /* Petal shape */
        }

        /* Success Card View */
        #card-display {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            z-index: 150;
            opacity: 0;
            pointer-events: none;
            width: 90%; max-width: 400px;
            background: white;
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .falling-petal {
            position: fixed;
            top: -10%;
            pointer-events: none;
            z-index: 99;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to { transform: translateY(110vh) rotate(360deg); }
        }

        .hidden { display: none !important; }
    </style>
</head>

<body class="h-screen w-screen flex flex-col items-center justify-center overflow-hidden">

    <iframe src="https://www.youtube.com/embed/P6yL6E_T7wM?autoplay=1&loop=1&playlist=P6yL6E_T7wM" class="hidden" allow="autoplay"></iframe>

    <div id="petal-overlay"></div>

    <div id="main-content" class="z-10 text-center max-w-lg px-6 w-full">
        <div id="initial-view" class="flex flex-col items-center gap-6">
            <h1 class="text-4xl font-serif italic text-rose-500 mb-4">A letter for you...</h1>
            <button id="open-btn" class="px-8 py-3 bg-rose-500 text-white rounded-full text-sm tracking-widest hover:bg-rose-600 transition-colors shadow-lg shadow-rose-200">
                OPEN
            </button>
        </div>

        <div id="question-view" class="hidden flex-col items-center gap-8 opacity-0">
            <h1 id="question-text" class="text-2xl md:text-3xl font-serif text-gray-800 leading-relaxed min-h-[140px] flex items-center justify-center px-4"></h1>
            
            <div id="buttons-container" class="hidden flex gap-4 w-full justify-center">
                <button id="yes-btn" class="px-10 py-4 bg-rose-500 text-white rounded-full font-medium shadow-lg hover:scale-105 transition-transform">Yes, Always</button>
                <button id="no-btn" class="px-10 py-4 border border-rose-200 text-rose-400 bg-white rounded-full font-medium shadow-sm">No thanks</button>
            </div>

            <button id="next-msg-btn" class="mt-8 px-10 py-3 bg-rose-100 text-rose-500 rounded-full font-medium hover:bg-rose-200 transition-colors">
                Continue ❤️
            </button>
        </div>

        <div id="success-view" class="hidden flex-col items-center gap-8 opacity-0 w-full max-w-md">
            <h1 class="text-2xl font-serif text-gray-400 italic">Select a number</h1>
            <div class="grid grid-cols-3 gap-4 w-full px-4">
                <div class="grid-item" onclick="showMessage(0)">1</div>
                <div class="grid-item" onclick="showMessage(1)">2</div>
                <div class="grid-item" onclick="showMessage(2)">3</div>
                <div class="grid-item" onclick="showMessage(3)">4</div>
                <div class="grid-item" onclick="showMessage(4)">5</div>
                <div class="grid-item" onclick="showMessage(5)">6</div>
            </div>
            <p class="text-rose-300 text-xs tracking-widest uppercase">Tap to reveal my heart</p>
        </div>
    </div>

    <div id="card-display">
        <div class="text-rose-500 text-4xl mb-4">♥</div>
        <p id="card-text" class="text-xl font-serif italic text-gray-700 leading-relaxed"></p>
        <button onclick="closeCard()" class="mt-8 text-rose-400 text-sm font-semibold tracking-tighter hover:text-rose-600 transition-colors">CLOSE</button>
    </div>

    <script>
        const loveMessages = [
            "“Obi doba, m'ani agye wo ho.” You are the only one who truly understands my soul.",
            "If love was a song, you'd be my favorite melody, the one I'd play on repeat forever.",
            "Chale, they say Jollof is sweet, but your love is the only thing that satisfies my heart.",
            "You are my Black Star—the brightest light in my sky, guiding me home wherever I am.",
            "I don’t just want to be with you; I want to build a world where only you and I exist.",
            "Will you be my Valentine?"
        ];

        const noTexts = [
            "Are you sure? 💔", "Think about it again...", "Is that your final answer?",
            "My heart is trembling...", "I beg, don't do this to me.", "Look me in the eyes..."
        ];

        const secretMessages = [
            "You are my greatest blessing.",
            "Every day with you is a gift.",
            "Your smile is my favorite view.",
            "I choose you today and every day.",
            "You are my home.",
            "I love you beyond words."
        ];

        let messageIndex = 0;
        let noCount = 0;

        const openBtn = document.getElementById('open-btn');
        const initialView = document.getElementById('initial-view');
        const questionView = document.getElementById('question-view');
        const questionText = document.getElementById('question-text');
        const nextMsgBtn = document.getElementById('next-msg-btn');
        const buttonsContainer = document.getElementById('buttons-container');
        const yesBtn = document.getElementById('yes-btn');
        const noBtn = document.getElementById('no-btn');
        const successView = document.getElementById('success-view');

        // Initial Transition
        openBtn.addEventListener('click', () => {
            anime({
                targets: '#initial-view',
                opacity: 0,
                translateY: -20,
                duration: 600,
                complete: () => {
                    initialView.classList.add('hidden');
                    questionView.classList.remove('hidden');
                    updateMessage();
                    anime({ targets: '#question-view', opacity: 1, translateY: [20, 0], duration: 800 });
                }
            });
        });

        function updateMessage() {
            questionText.innerText = loveMessages[messageIndex];
            if (messageIndex === loveMessages.length - 1) {
                nextMsgBtn.classList.add('hidden');
                buttonsContainer.classList.remove('hidden');
            }
        }

        nextMsgBtn.addEventListener('click', () => {
            messageIndex++;
            updateMessage();
            anime({ targets: '#question-text', opacity: [0, 1], scale: [0.95, 1], duration: 500 });
        });

        noBtn.addEventListener('click', () => {
            if (noCount < noTexts.length) {
                questionText.innerText = noTexts[noCount];
                noCount++;
            } else {
                // Remove the "Valentine" text and button on final No
                questionText.innerText = "I understand. I'll always be here... 🥀";
                buttonsContainer.classList.add('hidden');
            }
        });

        yesBtn.addEventListener('click', () => {
            triggerPetalTransition();
        });

        function triggerPetalTransition() {
            const overlay = document.getElementById('petal-overlay');
            overlay.innerHTML = '';
            for (let i = 0; i < 100; i++) {
                const petal = document.createElement('div');
                petal.className = 'petal-transition';
                overlay.appendChild(petal);
            }

            anime({
                targets: '.petal-transition',
                scale: [0, 1.2],
                rotate: '1turn',
                delay: anime.stagger(10, {grid: [10, 10], from: 'center'}),
                duration: 800,
                easing: 'easeInOutQuad',
                complete: () => {
                    questionView.classList.add('hidden');
                    successView.classList.remove('hidden');
                    successView.style.opacity = 1;
                    
                    anime({
                        targets: '.petal-transition',
                        opacity: 0,
                        duration: 800,
                        delay: 200,
                        easing: 'linear'
                    });
                    startPetalRain();
                }
            });
        }

        function showMessage(idx) {
            document.getElementById('card-text').innerText = secretMessages[idx];
            const card = document.getElementById('card-display');
            card.style.pointerEvents = 'auto';
            anime({
                targets: '#card-display',
                opacity: 1,
                scale: [0.8, 1],
                duration: 600,
                easing: 'easeOutBack'
            });
        }

        function closeCard() {
            const card = document.getElementById('card-display');
            card.style.pointerEvents = 'none';
            anime({ targets: '#card-display', opacity: 0, scale: 0.8, duration: 400 });
        }

        function startPetalRain() {
            setInterval(() => {
                const petal = document.createElement('div');
                petal.innerHTML = '🌸';
                petal.className = 'falling-petal';
                petal.style.left = Math.random() * 100 + 'vw';
                petal.style.fontSize = (Math.random() * 15 + 10) + 'px';
                petal.style.animationDuration = (Math.random() * 3 + 2) + 's';
                document.body.appendChild(petal);
                setTimeout(() => petal.remove(), 4000);
            }, 200);
        }
    </script>
</body>
</html>
