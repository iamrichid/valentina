<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine?</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:ital,wght@1,400&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #FAFAFA;
            /* Off-white */
            color: #1A1A1A;
            /* Dark Grey */
        }

        .font-serif {
            font-family: 'Playfair Display', serif;
        }

        .fade-in {
            animation: fadeIn 1s ease-in-out forwards;
            opacity: 0;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'val-bg': '#FAFAFA',
                        'val-text': '#1A1A1A',
                        'val-accent': '#C4203B', // Deep Red
                        'val-soft': '#E5E5E5',
                    }
                }
            }
        }
    </script>
</head>

<body
    class="h-screen w-screen flex flex-col items-center justify-center overflow-hidden selection:bg-val-accent selection:text-white">

    <!-- Background Canvas for subtle particles -->
    <canvas id="bg-canvas" class="absolute top-0 left-0 w-full h-full pointer-events-none opacity-50"></canvas>

    <div id="main-content" class="z-10 text-center max-w-lg px-6">

        <!-- Intitial State -->
        <div id="initial-view" class="flex flex-col items-center gap-6 fade-in" style="animation-delay: 0.2s;">
            <div class="text-xs tracking-[0.3em] uppercase text-gray-400 mb-2">February 14th</div>
            <h1 class="text-4xl md:text-5xl font-serif italic text-val-text mb-4 leading-tight">
                For You.
            </h1>
            <button id="open-btn"
                class="mt-8 px-8 py-3 border border-val-text/20 rounded-full text-sm hover:bg-val-text hover:text-white transition-all duration-500 ease-out tracking-wide">
                View Message
            </button>
        </div>

        <!-- Question State (Hidden) -->
        <div id="question-view" class="hidden flex-col items-center gap-8 opacity-0">
            <div class="text-6xl mb-4 text-val-accent">♥</div>
            <h1 class="text-3xl md:text-5xl font-serif text-val-text leading-tight">
                Will you be my Valentine?
            </h1>

            <p class="text-gray-500 font-light text-lg italic mt-2">
                "In all the world, there is no heart for me like yours."
            </p>

            <div class="flex flex-col sm:flex-row gap-4 mt-8 w-full justify-center">
                <button id="yes-btn"
                    class="px-10 py-4 bg-val-text text-white rounded-full text-sm font-medium tracking-wide hover:scale-105 transition-transform duration-300 shadow-lg">
                    Yes, Always
                </button>
                <button id="no-btn"
                    class="px-10 py-4 border border-gray-200 text-gray-500 rounded-full text-sm font-medium tracking-wide hover:border-gray-400 transition-colors duration-300 bg-white">
                    No thanks
                </button>
            </div>
        </div>

        <!-- Success State (Hidden) -->
        <div id="success-view" class="hidden flex-col items-center gap-6 opacity-0">
            <h1 class="text-4xl md:text-6xl font-serif italic text-val-text mb-2">
                Wonderful.
            </h1>
            <p class="text-gray-400 text-sm tracking-widest uppercase">See you soon</p>
        </div>

    </div>

    <script src="script.js"></script>
</body>

</html>
