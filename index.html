        :root {
            --rose-primary: #FB7185;
            --rose-soft: #FFF9F9;
            --text-main: #1A1A1A;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--rose-soft);
            color: var(--text-main);
            margin: 0;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .font-elegant {
            font-family: 'Cormorant Garamond', serif;
        }

        .setup-input {
            background: transparent;
            border-bottom: 2px solid #E5E5E5;
            padding: 12px 0;
            outline: none;
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.5rem;
            /* Standardized size */
            width: 100%;
            text-align: center;
            color: var(--text-main);
        }

        .setup-input::placeholder {
            color: #A0A0A0;
            /* Lighter gray for placeholder */
            opacity: 1;
        }

        /* Fix Chrome Autofill Yellow Background */
        .setup-input:-webkit-autofill,
        .setup-input:-webkit-autofill:hover,
        .setup-input:-webkit-autofill:focus,
        .setup-input:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 30px white inset !important;
            -webkit-text-fill-color: var(--text-main) !important;
            transition: background-color 5000s ease-in-out 0s;
        }

        .btn-choice {
            padding: 10px 16px;
            border: 1px solid #E5E5E5;
            border-radius: 50px;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            transition: 0.3s;
        }

        .btn-choice.active {
            background: var(--rose-primary);
            color: white;
            border-color: var(--rose-primary);
        }

        .price-btn {
            padding: 10px;
            border: 2px solid #EEE;
            border-radius: 12px;
            transition: 0.3s;
            width: 100%;
            text-align: center;
            background: white;
        }

        .price-btn.active {
            border-color: var(--rose-primary);
            background: #FFF1F2;
        }

        #heart-trigger {
            font-size: 6.5rem;
            cursor: pointer;
            filter: drop-shadow(0 0 15px rgba(251, 113, 133, 0.4));
            position: relative;
            z-index: 50;
        }

        .falling-petal {
            position: fixed;
            top: -5vh;
            pointer-events: none;
            z-index: 1;
            animation: fall linear forwards;
            opacity: 0.6;
        }

        @keyframes fall {
            to {
                transform: translateY(105vh) rotate(360deg);
            }
        }

        #petal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            grid-template-rows: repeat(10, 1fr);
        }

        .overlay-petal {
            background: var(--rose-primary);
            border-radius: 50% 0 50% 50%;
            opacity: 0;
        }

        .hidden {
            display: none !important;
        }

        .lyrics-text {
            font-size: 2.2rem;
            line-height: 1.4;
            color: #2D2D2D;
            padding: 0 20px;
        }

        @media (max-width: 640px) {
            .lyrics-text {
                font-size: 1.8rem;
            }
        }

        /* Add this to your <style> section */
        .falling-petal {
            filter: drop-shadow(0 0 5px rgba(251, 113, 133, 0.2));
        }

        /* Optional: Blur petals that are 'further away' */
        div[style*="z-index: 5"] {
            filter: blur(1px) opacity(0.4);
        }

        #momo-modal {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
        }

        .admin-mode .price-btn.active {
            background: #dcfce7 !important;
            /* Green for admin */
            border-color: #22c55e !important;
        }

        .admin-mode #action-btn {
            background: #22c55e !important;
        }

        /* PREMIUM GOLD THEME */
        .premium-mode {
            --rose-primary: #D4AF37;
            /* Gold */
            --rose-soft: #FFFBF0;
            /* Creamy Gold */
            background: linear-gradient(135deg, #FFFBF0 0%, #FFF5D6 100%);
        }

        .premium-mode .text-rose-500,
        .premium-mode .text-rose-400 {
            color: #D4AF37 !important;
        }

        .premium-mode #read-btn {
            border-color: #D4AF37 !important;
        }

        .premium-mode .overlay-petal {
            background: #D4AF37 !important;
        }

        /* SWEET PINK THEME */
        .sweet-mode {
            --rose-primary: #FF69B4;
            /* Hot Pink */
            --rose-soft: #FFF0F5;
            /* Lavender Blush */
            background: linear-gradient(to top, #fad0c4 0%, #ffd1ff 100%);
        }

        .sweet-mode .falling-petal {
            animation: floatUp 8s linear forwards;
        }

        @keyframes floatUp {
            from {
                transform: translateY(110vh) scale(0.5);
                opacity: 0;
            }

            to {
                transform: translateY(-10vh) scale(1.2);
                opacity: 1;
            }
        }

        .fade-in-up {
            animation: fadeInUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Text Shimmer Effect (Premium) */
        .text-shimmer {
            background: linear-gradient(to right, #D4AF37 20%, #FFF5D6 40%, #D4AF37 60%, #B8860B 80%);
            background-size: 200% auto;
            color: transparent !important;
            background-clip: text;
            -webkit-background-clip: text;
            animation: shimmer 3s linear infinite;
        }

        @keyframes shimmer {
            to {
                background-position: 200% center;
            }
        }

        /* Pulse Text Effect (Sweet) */
        .text-pulse {
            animation: pulseText 2s infinite;
            color: #FF1493;
            /* Deep Pink */
        }

        @keyframes pulseText {
            0% {
                transform: scale(1);
                text-shadow: 0 0 0 rgba(255, 20, 147, 0);
            }

            50% {
                transform: scale(1.02);
                text-shadow: 0 0 10px rgba(255, 20, 147, 0.5);
            }

            100% {
                transform: scale(1);
                text-shadow: 0 0 0 rgba(255, 20, 147, 0);
            }
        }

        /* Typewriter Cursor */
        .cursor::after {
            content: '|';
            animation: blink 1s step-start infinite;
            color: var(--rose-primary);
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }

</head>

                if (now - lastTrailTime < 50) return; // Throttle to 50ms
                lastTrailTime = now;

                const x = e.touches ? e.touches[0].clientX : e.clientX;
                const y = e.touches ? e.touches[0].clientY : e.clientY;

                const heart = document.createElement('div');
                heart.className = 'trail-heart';
                heart.innerText = ['❤️', '💖', '✨', '🌸'][Math.floor(Math.random() * 4)];
                heart.style.left = `${x}px`;
                heart.style.top = `${y}px`;
                document.body.appendChild(heart);

                setTimeout(() => heart.remove(), 1000);
            };

            document.addEventListener('mousemove', handleTrail);
            document.addEventListener('touchmove', handleTrail, { passive: true });
        };

        // --- ENCRYPTION HELPERS ---
        function encryptData(data) {
            try {
                return CryptoJS.AES.encrypt(JSON.stringify(data), SECRET_KEY).toString();
            } catch (e) { console.error("Encrypt Error", e); return null; }
        }

        function decryptData(ciphertext) {
            try {
                const bytes = CryptoJS.AES.decrypt(ciphertext, SECRET_KEY);
                return JSON.parse(bytes.toString(CryptoJS.enc.Utf8));
            } catch (e) { console.error("Decrypt Error", e); return null; }
        }

        function setRel(t) {
            config.type = t;
            document.querySelectorAll('.btn-choice').forEach(b => b.classList.remove('active'));
            document.getElementById(`rel-${t}`).classList.add('active');
        }

        function setPrice(amt) {
            config.amount = amt;
            // Map amount to tier
            if (amt === 0) config.tier = "free";
            else if (amt === 2) config.tier = "basic";
            else if (amt === 5) config.tier = "sweet";
            else if (amt === 10) config.tier = "heavy";

            document.querySelectorAll('.price-btn').forEach(b => b.classList.remove('active'));
            const btn = document.getElementById('action-btn');
            const desc = document.getElementById('tier-description');
            const inputs = document.getElementById('sender-inputs');

            // Toggle Sender Name Visibility (Tier 5+) - REMOVED (Always Visible)

            // Toggle WhatsApp Visibility (Tier 10+) - REMOVED (Always Visible)

            // INSTANT PREVIEW LOGIC
            document.body.classList.remove('premium-mode', 'sweet-mode');
            if (config.tier === 'heavy') document.body.classList.add('premium-mode');
            if (config.tier === 'sweet') document.body.classList.add('sweet-mode');

            if (isAdmin) {
                btn.innerText = `Generate Admin Link (${config.tier})`;
                return;
            }

            if (amt === 0) {
                btn.innerText = "Generate Free Link";
                desc.innerText = "Standard romantic notes.";
            } else if (amt === 2) {
                btn.innerText = `Pay ₵${amt}`;
                desc.innerText = "Sweeter messages. Deeper feelings.";
            } else if (amt === 5) {
                btn.innerText = `Pay ₵${amt}`;
                desc.innerText = "💖 PINK THEME + Floating Hearts + Very Romantic.";
            } else if (amt === 10) {
                btn.innerText = `Pay ₵${amt}`;
                desc.innerText = "👑 GOLD THEME + Your Name Signed + VIP Emojis + The Deepest Love Letters.";
            }
        }

        // Initialize description on load
        setPrice(0);

        document.getElementById('action-btn').onclick = () => {
            const name = document.getElementById('target-name').value;
            if (!name) { alert("Enter a name first!"); return; }

            if (isAdmin) {
                generateLink();
                return;
            }

            if (config.amount === 0) {
                generateLink();
            } else {
                payWithPaystack();
            }
        };

        function payWithPaystack() {
            const email = document.getElementById('sender-email').value;
            if (!email) {
                alert("Please enter your email for payment receipt.");
                return;
            }
            config.senderEmail = email;

            const handler = PaystackPop.setup({
                key: 'pk_live_ecce9880147eb02a817c34a44bfe77b31dccb1d5', // Replace with your public key
                email: email,
                amount: config.amount * 100, // Amount in kobo
                currency: 'GHS',
                ref: '' + Math.floor((Math.random() * 1000000000) + 1), // Generate a random reference number
                callback: function (response) {
                    // Payment successful
                    // alert('Payment complete! Reference: ' + response.reference);
                    generateLink(); // Automatically generate link
                },
                onClose: function () {
                    alert('Transaction was not completed, window closed.');
                }
            });
            handler.openIframe();
        }

        function generateLink() {
            // Create data object
            const data = {
                name: document.getElementById('target-name').value,
                sender: document.getElementById('sender-name').value,
                senderPhone: document.getElementById('sender-phone').value,
                type: config.type,
                tier: config.tier
            };

            // Encrypt it
            const encryptedParams = encryptData(data);

            // Base URL Strategy:
            // 1. If we are on ANY variant of Netlify (e.g. deploy preview or production), use THAT url.
            // 2. If we are on localhost or file://, force the LIVE production URL.
            let baseUrl = "https://valentilove.netlify.app";

            if (window.location.hostname.includes("netlify.app")) {
                baseUrl = window.location.origin + window.location.pathname;
            }

            const url = `${baseUrl}?data=${encodeURIComponent(encryptedParams)}`;

            navigator.clipboard.writeText(url).then(() => {
                const status = document.getElementById('copy-status');
                status.innerText = isAdmin ? "Admin Link Copied!" : "Link Copied! Send it now.";
                status.style.opacity = 1;
            }).catch(err => {
                console.error("Clipboard failed", err);
                prompt("Copy this link:", url);
            });
        }



        function startExperience() {
            document.getElementById('setup-view').classList.add('hidden');
            document.getElementById('experience-wrapper').classList.remove('hidden');

            // Premium & Sweet Logic
            if (config.tier === 'heavy') {
                document.body.classList.add('premium-mode');
                document.getElementById('intro-title').classList.add('text-shimmer'); // Add shimmer
                if (config.sender) themes[config.type].success.push(`Love, ${config.sender}`);
            } else if (config.tier === 'sweet') {
                document.body.classList.add('sweet-mode');
                document.getElementById('intro-title').classList.add('text-pulse'); // Add pulse
            }

            typeWriter('intro-title', `A note for ${config.name}.`);

            if (config.sender) {
                const sub = document.getElementById('intro-subtitle');
                sub.innerText = `FROM ${config.sender}`;
                sub.classList.remove('opacity-0');
                anime({ targets: '#intro-subtitle', opacity: 1, delay: 1000, duration: 1000 });
            }

            // Reply Button Logic
            if (config.senderPhone) {
                const btn = document.getElementById('reply-btn');
                btn.classList.remove('hidden');
                btn.onclick = () => {
                    const text = `Yes! I will be your Valentine... 💖`;
                    window.open(`https://wa.me/${config.senderPhone}?text=${encodeURIComponent(text)}`, '_blank');
                };
            }

            // Set music based on theme
            const audio = document.getElementById('bg-music');
            audio.src = themes[config.type].music;
            audio.load();
        }

        document.getElementById('read-btn').onclick = () => {
            document.getElementById('bg-music').play().catch(() => { console.log('Autoplay blocked'); });
            anime({
                targets: '#intro-view', opacity: 0, duration: 600, complete: () => {
                    document.getElementById('intro-view').classList.add('hidden');
                    document.getElementById('question-view').classList.remove('hidden');
                    showNext();
                    anime({ targets: '#question-view', opacity: 1, translateY: [20, 0], duration: 800 });
                }
            });
        };

        function showNext() {
            const list = themes[config.type].tiers[config.tier];
            typeWriter('question-text', list[msgIndex], 50);

            if (msgIndex === list.length - 1) {
                document.getElementById('next-msg-btn').classList.add('hidden');
                document.getElementById('buttons-container').classList.remove('hidden');
            }
        }

        // New Typewriter Helper with Cursor
        function typeWriter(elementId, text, speed = 50) {
            const element = document.getElementById(elementId);
            element.innerHTML = '<span class="cursor"></span>'; // Start with cursor
            let i = 0;

            function type() {
                if (i < text.length) {
                    element.innerHTML = text.substring(0, i + 1) + '<span class="cursor"></span>';
                    i++;
                    setTimeout(type, speed);
                } else {
                    element.innerHTML = text; // Remove cursor at end
                }
            }
            type();
        }

        document.getElementById('next-msg-btn').onclick = () => {
            msgIndex++; showNext();
        };

        document.getElementById('no-btn').onclick = function () {
            const yes = document.getElementById('yes-btn');
            let currentScale = parseFloat(yes.style.transform.replace('scale(', '').replace(')', '')) || 1;
            yes.style.transform = `scale(${currentScale + 0.5})`;
            if (currentScale > 3.5) this.classList.add('hidden');
        };

        document.getElementById('yes-btn').onclick = () => {
            const overlay = document.getElementById('petal-overlay');
            let emojis = themes[config.type].emojis;

            // Premium Emojis
            if (config.tier === 'heavy') {
                emojis = ['✨', '🌟', '💛', '🏵️', '👑'];
            }

            for (let i = 0; i < 100; i++) {
                const p = document.createElement('div');
                p.className = 'overlay-petal w-full h-full flex items-center justify-center text-4xl';
                p.innerHTML = emojis[Math.floor(Math.random() * emojis.length)];
                p.style.background = 'transparent'; // Remove background color
                overlay.appendChild(p);
            }

            // Confetti Explosion
            confetti({
                particleCount: 150,
                spread: 100,
                origin: { y: 0.6 },
                colors: ['#FF69B4', '#FF1493', '#D4AF37'], // Pink, Deep Pink, Gold
                shapes: ['circle', 'square'],
                scalar: 1.2
            });

            anime({
                targets: '.overlay-petal', scale: [0, 1.2], opacity: [0, 1], duration: 800, delay: anime.stagger(15, { grid: [10, 10], from: 'center' }),
                complete: () => {
                    document.getElementById('question-view').classList.add('hidden');
                    document.getElementById('success-view').classList.remove('hidden');
                    document.getElementById('success-view').style.opacity = 1;
                    document.getElementById('final-message').innerText = `Tap the heart, ${config.name}...`;
                    anime({ targets: '#petal-overlay', opacity: 0, duration: 800, delay: 400, complete: () => document.getElementById('petal-overlay').classList.add('hidden') });
                }
            });
        };

        document.getElementById('heart-trigger').onclick = () => {
            const list = themes[config.type].success;
            const msgEl = document.getElementById('final-message');
            anime({ targets: '#heart-trigger', scale: [1, 1.3, 1], duration: 400 });
            for (let i = 0; i < 5; i++) createPetal(); // Increased count for effect
            anime({
                targets: msgEl, opacity: 0, duration: 300, complete: () => {
                    msgEl.innerText = list[flowIndex];
                    flowIndex = (flowIndex + 1) % list.length;
                    anime({ targets: msgEl, opacity: 1, duration: 600 });
                }
            });
        };

        let msgIndex = 0, flowIndex = 0;
        function createPetal() {
            const petal = document.createElement('div');
            let emojis = themes[config.type].emojis || ['🌸', '🌹'];

            if (config.tier === 'heavy') {
                emojis = ['✨', '🌟', '💛', '🏵️', '👑'];
            } else if (config.tier === 'sweet') {
                emojis = ['❤️', '💖', '💝', '💕', '💓'];
            }

            petal.innerHTML = emojis[Math.floor(Math.random() * emojis.length)];
            petal.style.position = 'fixed';
            petal.style.top = '-50px';
            petal.style.left = Math.random() * 100 + 'vw';
            petal.style.fontSize = (Math.random() * 15 + 10) + 'px';
            petal.style.zIndex = Math.random() > 0.5 ? '5' : '30';
            petal.style.pointerEvents = 'none';
            petal.style.userSelect = 'none';
            petal.style.opacity = Math.random() * 0.5 + 0.3;

            document.body.appendChild(petal);

            // Sweet Mode Animation Override (Float Up)
            if (config.tier === 'sweet') {
                anime({
                    targets: petal,
                    translateY: ['110vh', '-10vh'],
                    translateX: {
                        value: () => (Math.random() - 0.5) * 400,
                        duration: 8000
                    },
                    scale: [0.5, 1.5],
                    opacity: [0, 1, 0],
                    duration: Math.random() * 5000 + 8000,
                    easing: 'linear',
                    complete: () => petal.remove()
                });
            } else {
                anime({
                    targets: petal,
                    translateY: '110vh',
                    translateX: [
                        { value: (Math.random() - 0.5) * 200, duration: 4000, easing: 'easeInOutSine' },
                        { value: (Math.random() - 0.5) * 200, duration: 4000, easing: 'easeInOutSine' }
                    ],
                    rotateZ: {
                        value: Math.random() * 360,
                        duration: 8000,
                        easing: 'linear'
                    },
                    rotateX: {
                        value: Math.random() * 720,
                        duration: 5000,
                        easing: 'linear'
                    },
                    duration: Math.random() * 4000 + 6000,
                    easing: 'linear',
                    complete: () => petal.remove()
                });
            }
        }

        setInterval(createPetal, 600);
    </script>
</body>
