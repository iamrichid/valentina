<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,300;1,500;1,600&family=Montserrat:wght@200;300;400&display=swap" rel="stylesheet">
    <style>
        :root { --rose-primary: #FB7185; --rose-soft: #FFF9F9; --text-main: #2C2C2C; }
        body { font-family: 'Montserrat', sans-serif; background-color: var(--rose-soft); color: var(--text-main); margin: 0; overflow-x: hidden; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .font-elegant { font-family: 'Cormorant Garamond', serif; }
        .falling-petal { position: fixed; top: -5vh; pointer-events: none; z-index: 1; animation: fall linear forwards; opacity: 0.5; }
        @keyframes fall { to { transform: translateY(105vh) rotate(360deg); } }
        .setup-input { background: transparent; border-bottom: 1px solid #E5E5E5; padding: 8px 0; outline: none; font-family: 'Cormorant Garamond', serif; font-size: 1.5rem; width: 100%; text-align: center; }
        .btn-choice { padding: 8px 16px; border: 1px solid #E5E5E5; border-radius: 50px; font-size: 9px; tracking: 0.2em; text-transform: uppercase; transition: 0.3s; }
        .btn-choice.active { background: var(--rose-primary); color: white; border-color: var(--rose-primary); }
        #heart-trigger { font-size: 4rem; cursor: pointer; filter: drop-shadow(0 0 10px rgba(251, 113, 133, 0.2)); -webkit-tap-highlight-color: transparent; }
        .overlay-petal { position: absolute; background: var(--rose-primary); border-radius: 50% 0 50% 50%; }
        #petal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 100; display: grid; grid-template-columns: repeat(10, 1fr); grid-template-rows: repeat(10, 1fr); }
        .hidden { display: none !important; }
    </style>
</head>

<body>

    <div id="petal-overlay"></div>

    <div id="setup-view" class="z-20 w-full max-w-sm px-10 flex flex-col gap-8 text-center">
        <h1 class="text-3xl font-elegant italic">Personalize the Flow</h1>
        
        <input type="text" id="target-name" class="setup-input" placeholder="Enter Name">
        
        <div class="flex flex-col gap-4">
            <p class="text-[9px] uppercase tracking-widest text-gray-400">Relationship</p>
            <div class="flex justify-center gap-2">
                <button onclick="setRel('lover')" id="rel-lover" class="btn-choice active">Lover</button>
                <button onclick="setRel('crush')" id="rel-crush" class="btn-choice">Crush</button>
                <button onclick="setRel('friend')" id="rel-friend" class="btn-choice">Friend</button>
            </div>
        </div>

        <button id="gen-btn" class="mt-4 py-4 bg-black text-white rounded-full text-[10px] tracking-[0.4em] uppercase">Generate & Copy Link</button>
        <p id="copy-status" class="text-[9px] text-rose-400 uppercase tracking-widest opacity-0">Link Copied to Clipboard!</p>
    </div>

    <div id="experience-wrapper" class="hidden relative z-10 w-full px-10 text-center">
        <div id="intro-view" class="flex flex-col items-center gap-10">
            <h1 class="text-4xl font-elegant italic font-light tracking-wide text-gray-800" id="intro-title"></h1>
            <button id="read-btn" class="text-[10px] tracking-[0.4em] uppercase border-b border-rose-300 pb-1 text-rose-400">Open Note</button>
        </div>

        <div id="question-view" class="hidden flex flex-col items-center gap-12 opacity-0">
            <h1 id="question-text" class="text-2xl md:text-3xl font-elegant italic font-medium text-gray-700 leading-relaxed min-h-[160px]"></h1>
            <div id="buttons-container" class="hidden flex gap-8 w-full justify-center">
                <button id="yes-btn" class="text-[11px] tracking-[0.3em] uppercase text-rose-500 font-semibold">Yes</button>
                <button id="no-btn" class="text-[11px] tracking-[0.3em] uppercase text-gray-300">No</button>
            </div>
            <button id="next-msg-btn" class="text-[10px] tracking-[0.4em] uppercase text-rose-300">Continue</button>
        </div>

        <div id="success-view" class="hidden flex flex-col items-center gap-12 opacity-0">
            <div id="heart-trigger">❤️</div>
            <div class="h-24 flex items-center justify-center">
                <p id="final-message" class="text-2xl font-elegant italic text-gray-600 px-4"></p>
            </div>
        </div>
    </div>

    <script>
        const themes = {
            lover: {
                messages: ["“Obi doba, m'ani agye wo ho.”", "Chale, your love sweet pass Ghana Jollof.", "You are my Black Star—the brightest light.", "I want to build a world with only you.", "Will you be my Valentine?"],
                success: ["You are my blessing.", "You are my home.", "Forever yours.", "I love you truly."]
            },
            crush: {
                messages: ["I’ve been shy to say this...", "Every time I see you, my heart skip beat.", "You be the only vibe I’m feeling lately.", "Could we be more than just friends?", "Will you be my Valentine?"],
                success: ["I'm glad I said it.", "You make me smile.", "Let's see where this goes.", "You're special."]
            },
            friend: {
                messages: ["Real ones are hard to find.", "Glad we're on the same vibe.", "Thank you for always being there.", "You make life much more fun.", "Will you be my Bestie forever?"],
                success: ["Friends for life.", "Always got your back.", "To many more vibes.", "You're a gem."]
            }
        };

        let config = { name: "", type: "lover" };
        let msgIndex = 0;
        let flowIndex = 0;

        // CHECK FOR URL PARAMS
        window.onload = () => {
            const params = new URLSearchParams(window.location.search);
            if (params.has('name')) {
                config.name = params.get('name');
                config.type = params.get('type') || 'lover';
                startExperience();
            }
            setInterval(createPetal, 400);
        };

        function setRel(t) {
            config.type = t;
            document.querySelectorAll('.btn-choice').forEach(b => b.classList.remove('active'));
            document.getElementById(`rel-${t}`).classList.add('active');
        }

        document.getElementById('gen-btn').onclick = () => {
            const name = document.getElementById('target-name').value || "Special One";
            const url = `${window.location.origin}${window.location.pathname}?name=${encodeURIComponent(name)}&type=${config.type}`;
            navigator.clipboard.writeText(url);
            document.getElementById('copy-status').style.opacity = 1;
        };

        function startExperience() {
            document.getElementById('setup-view').classList.add('hidden');
            document.getElementById('experience-wrapper').classList.remove('hidden');
            document.getElementById('intro-title').innerText = `A note for ${config.name}.`;
        }

        document.getElementById('read-btn').onclick = () => {
            anime({ targets: '#intro-view', opacity: 0, duration: 600, complete: () => {
                document.getElementById('intro-view').classList.add('hidden');
                document.getElementById('question-view').classList.remove('hidden');
                showNext();
                anime({ targets: '#question-view', opacity: 1, duration: 800 });
            }});
        };

        function showNext() {
            const list = themes[config.type].messages;
            document.getElementById('question-text').innerText = list[msgIndex];
            if (msgIndex === list.length - 1) {
                document.getElementById('next-msg-btn').classList.add('hidden');
                document.getElementById('buttons-container').classList.remove('hidden');
            }
        }

        document.getElementById('next-msg-btn').onclick = () => {
            msgIndex++; showNext();
            anime({ targets: '#question-text', opacity: [0, 1], duration: 400 });
        };

        document.getElementById('yes-btn').onclick = () => {
            const overlay = document.getElementById('petal-overlay');
            for(let i=0; i<100; i++) {
                const p = document.createElement('div'); p.className = 'overlay-petal w-full h-full';
                overlay.appendChild(p);
            }
            anime({ targets: '.overlay-petal', scale: [0, 1.2], duration: 800, delay: anime.stagger(15, {grid:[10,10], from:'center'}),
                complete: () => {
                    document.getElementById('question-view').classList.add('hidden');
                    document.getElementById('success-view').classList.remove('hidden');
                    document.getElementById('success-view').style.opacity = 1;
                    document.getElementById('final-message').innerText = `Tap the heart, ${config.name}...`;
                }
            });
        };

        document.getElementById('heart-trigger').onclick = () => {
            const list = themes[config.type].success;
            const msgEl = document.getElementById('final-message');
            anime({ targets: '#heart-trigger', scale: [1, 1.3, 1], duration: 400 });
            anime({ targets: msgEl, opacity: 0, duration: 300, complete: () => {
                msgEl.innerText = list[flowIndex];
                flowIndex = (flowIndex + 1) % list.length;
                anime({ targets: msgEl, opacity: 1, duration: 600 });
            }});
        };

        function createPetal() {
            const p = document.createElement('div');
            p.innerHTML = '🌸'; p.className = 'falling-petal';
            p.style.left = Math.random() * 100 + 'vw';
            p.style.fontSize = (Math.random() * 10 + 12) + 'px';
            const d = Math.random() * 5 + 5;
            p.style.animationDuration = d + 's';
            document.body.appendChild(p);
            setTimeout(() => p.remove(), d * 1000);
        }
    </script>
</body>
</html>
