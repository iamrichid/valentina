    <style>
        :root {
            --rose-primary: #FB7185;
            --rose-soft: #FFF9F9;
            --text-main: #1A1A1A;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--rose-soft);
            color: var(--text-main);
            margin: 0;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .font-elegant {
            font-family: 'Cormorant Garamond', serif;
        }

        .setup-input {
            background: transparent;
            border-bottom: 2px solid #E5E5E5;
            padding: 12px 0;
            outline: none;
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.5rem;
            /* Standardized size */
            width: 100%;
            text-align: center;
            color: var(--text-main);
        }

        .setup-input::placeholder {
            color: #A0A0A0;
            /* Lighter gray for placeholder */
            opacity: 1;
        }

        /* Fix Chrome Autofill Yellow Background */
        .setup-input:-webkit-autofill,
        .setup-input:-webkit-autofill:hover,
        .setup-input:-webkit-autofill:focus,
        .setup-input:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 30px white inset !important;
            -webkit-text-fill-color: var(--text-main) !important;
            transition: background-color 5000s ease-in-out 0s;
        }

        .btn-choice {
            padding: 10px 16px;
            border: 1px solid #E5E5E5;
            border-radius: 50px;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            transition: 0.3s;
        }

        .btn-choice.active {
            background: var(--rose-primary);
            color: white;
            border-color: var(--rose-primary);
        }

        .price-btn {
            padding: 10px;
            border: 2px solid #EEE;
            border-radius: 12px;
            transition: 0.3s;
            width: 100%;
            text-align: center;
            background: white;
        }

        .price-btn.active {
            border-color: var(--rose-primary);
            background: #FFF1F2;
        }

        #heart-trigger {
            font-size: 6.5rem;
            cursor: pointer;
            filter: drop-shadow(0 0 15px rgba(251, 113, 133, 0.4));
            position: relative;
            z-index: 50;
        }

        .falling-petal {
            position: fixed;
            top: -5vh;
            pointer-events: none;
            z-index: 1;
            animation: fall linear forwards;
            opacity: 0.6;
        }

        @keyframes fall {
            to {
                transform: translateY(105vh) rotate(360deg);
            }
        }

        #petal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            grid-template-rows: repeat(10, 1fr);
        }

        .overlay-petal {
            background: var(--rose-primary);
            border-radius: 50% 0 50% 50%;
            opacity: 0;
        }

        .hidden {
            display: none !important;
        }

        .lyrics-text {
            font-size: 2.2rem;
            line-height: 1.4;
            color: #2D2D2D;
            padding: 0 20px;
        }

        @media (max-width: 640px) {
            .lyrics-text {
                font-size: 1.8rem;
            }
        }

        /* Add this to your <style> section */
        .falling-petal {
            filter: drop-shadow(0 0 5px rgba(251, 113, 133, 0.2));
        }

        /* Optional: Blur petals that are 'further away' */
        div[style*="z-index: 5"] {
            filter: blur(1px) opacity(0.4);
        }

        #momo-modal {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
        }



        /* PREMIUM GOLD THEME (HEAVY) */
        .premium-mode {
            --rose-primary: #D4AF37;
            /* Gold */
            --rose-soft: #FFFBF0;
            /* Creamy Gold */
            background: linear-gradient(135deg, #FFFBF0 0%, #FFF5D6 100%);
        }

        /* SPARK THEME (BASIC) */
        .spark-mode {
            --rose-primary: #FF4500;
            /* Orange Red */
            --rose-soft: #FFF0E5;
            /* Peach Mist */
            background: linear-gradient(120deg, #fdfbfb 0%, #ebedee 100%);
            /* Subtle clean start */
            background: linear-gradient(to top, #fad0c4 0%, #ffd1ff 100%);
            /* Placeholder, let's do a warm one */
            background: linear-gradient(120deg, #fff1eb 0%, #ace0f9 100%);
            /* No */
            background: linear-gradient(to right, #ffecd2 0%, #fcb69f 100%);
            /* Warm Peach */
        }

        .spark-mode #intro-title {
            animation: heartbeat 1.5s ease-in-out infinite both;
            color: #FF4500;
        }

        .spark-mode .overlay-petal {
            background: #FF4500 !important;
        }

        @keyframes heartbeat {
            from {
                transform: scale(1);
                transform-origin: center center;
                animation-timing-function: ease-out;
            }

            10% {
                transform: scale(0.91);
                animation-timing-function: ease-in;
            }

            17% {
                transform: scale(0.98);
                animation-timing-function: ease-out;
            }

            33% {
                transform: scale(0.87);
                animation-timing-function: ease-in;
            }

            45% {
                transform: scale(1);
                animation-timing-function: ease-out;
            }
        }

        .premium-mode .text-rose-500,
        .premium-mode .text-rose-400 {
            color: #D4AF37 !important;
        }

        .premium-mode #read-btn {
            border-color: #D4AF37 !important;
        }

        .premium-mode .overlay-petal {
            background: #D4AF37 !important;
        }

        /* SWEET PINK THEME */
        .sweet-mode {
            --rose-primary: #FF69B4;
            /* Hot Pink */
            --rose-soft: #FFF0F5;
            /* Lavender Blush */
            background: linear-gradient(to top, #fad0c4 0%, #ffd1ff 100%);
        }

        .sweet-mode .falling-petal {
            animation: floatUp 8s linear forwards;
        }

        @keyframes floatUp {
            from {
                transform: translateY(110vh) scale(0.5);
                opacity: 0;
            }

            to {
                transform: translateY(-10vh) scale(1.2);
                opacity: 1;
            }
        }

        .fade-in-up {
            animation: fadeInUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Text Shimmer Effect (Premium) */
        .text-shimmer {
            background: linear-gradient(to right, #D4AF37 20%, #FFF5D6 40%, #D4AF37 60%, #B8860B 80%);
            background-size: 200% auto;
            color: transparent !important;
            background-clip: text;
            -webkit-background-clip: text;
            animation: shimmer 3s linear infinite;
        }

        @keyframes shimmer {
            to {
                background-position: 200% center;
            }
        }

        /* Pulse Text Effect (Sweet) */
        .text-pulse {
            animation: pulseText 2s infinite;
            color: #FF1493;
            /* Deep Pink */
        }

        @keyframes pulseText {
            0% {
                transform: scale(1);
                text-shadow: 0 0 0 rgba(255, 20, 147, 0);
            }

            50% {
                transform: scale(1.02);
                text-shadow: 0 0 10px rgba(255, 20, 147, 0.5);
            }

            100% {
                transform: scale(1);
                text-shadow: 0 0 0 rgba(255, 20, 147, 0);
            }
        }

        /* Slide-in Animation for Paid Inputs */
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-12px);
                max-height: 0;
            }

            to {
                opacity: 1;
                transform: translateY(0);
                max-height: 200px;
            }
        }

        .slide-in {
            animation: slideDown 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Typewriter Cursor */
        .cursor::after {
            content: '|';
            animation: blink 1s step-start infinite;
            color: var(--rose-primary);
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }
    </style>

    <style>
        /* Interactive Heart Trail */
        .trail-heart {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            font-size: 1.2rem;
            animation: floatFade 1s linear forwards;
        }

        @keyframes floatFade {
            0% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }

            100% {
                transform: translate(-50%, -150%) scale(0.5);
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <div id="petal-overlay"></div>
    <audio id="bg-music" loop>
        <source src="https://www.bensound.com/bensound-music/bensound-love.mp3" type="audio/mpeg">
    </audio>

    <div id="setup-view"

        <div class="flex flex-col items-center gap-2">
            <img src="logo.png" alt="OdoFlow Logo" class="w-32 h-auto drop-shadow-md">
            <p class="text-xs text-gray-400 leading-relaxed max-w-[260px]">Send a personalised Valentine's message
                to someone special. Pick a vibe, choose your tier, and share the love 💕</p>
        </div>

        <!-- Gender Selector -->
        <div class="flex flex-col gap-2 text-left">
            <p class="text-[11px] uppercase tracking-widest text-gray-400 font-bold ml-2">Sending To</p>
            <div class="flex justify-center gap-2">
                <button onclick="setGender('her')" id="gen-her" class="btn-choice active">Her 👧</button>
                <button onclick="setGender('him')" id="gen-him" class="btn-choice">Him 👦</button>
                <button onclick="setGender('them')" id="gen-them" class="btn-choice">Them 🧑</button>
            </div>
        </div>


        <div class="flex flex-col gap-2 text-left">
            <p class="text-[11px] uppercase tracking-widest text-gray-400 font-bold ml-2">Relationship</p>
            <div class="flex flex-wrap justify-center gap-2">
                <button onclick="setRel('lover')" id="rel-lover" class="btn-choice active">Lover</button>
                <button onclick="setRel('crush')" id="rel-crush" class="btn-choice">Crush</button>
                <button onclick="setRel('parent')" id="rel-parent" class="btn-choice">Parent</button>
                <button onclick="setRel('child')" id="rel-child" class="btn-choice">Child</button>
                <button onclick="setRel('sibling')" id="rel-sibling" class="btn-choice">Sibling</button>
                <button onclick="setRel('friend')" id="rel-friend" class="btn-choice">Friend</button>
                <button onclick="setRel('colleague')" id="rel-colleague" class="btn-choice">Colleague</button>
                <button onclick="setRel('boss')" id="rel-boss" class="btn-choice">Boss</button>
                <button onclick="setRel('enemy')" id="rel-enemy" class="btn-choice">Enemy</button>
            </div>
        </div>

        <div class="flex flex-col gap-2 text-left">
            <p class="text-[11px] uppercase tracking-widest text-gray-400 font-bold ml-2">Tier</p>
            <div class="grid grid-cols-4 gap-2">
                <button onclick="setPrice(0)" id="p-0" class="price-btn active"><span
                        class="block text-sm font-bold">₵0</span><span class="text-[9px] uppercase">Free</span></button>
                <button onclick="setPrice(2)" id="p-2" class="price-btn"><span
                        class="block text-sm font-bold">₵2</span><span
                        class="text-[9px] uppercase">Basic</span></button>
                <button onclick="setPrice(5)" id="p-5" class="price-btn"><span
                        class="block text-sm font-bold">₵5</span><span
                        class="text-[9px] uppercase">Sweet</span></button>
                <button onclick="setPrice(10)" id="p-10" class="price-btn"><span
                        class="block text-sm font-bold">₵10</span><span

            </div>
        </div>
        <p id="tier-description" class="text-xs text-gray-500 italic px-4 mt-2 h-8 leading-tight">
            Standard romantic notes.
        </p>

        <input type="text" id="target-name" class="setup-input" placeholder="Their Name">

        <!-- Sender Inputs (Paid Only) -->
        <div id="sender-inputs" class="w-full flex flex-col gap-2 hidden">
            <input type="text" id="sender-name" class="setup-input" placeholder="Your Name">
        </div>

        <!-- WhatsApp Input (Paid Only) -->
        <div id="whatsapp-inputs" class="w-full flex flex-col gap-2 hidden">
            <input type="tel" id="sender-phone" class="setup-input" placeholder="Your WhatsApp (For Reply)">
            <input type="email" id="sender-email" class="setup-input" placeholder="Your Email (For Receipt)">
        </div>

        <!-- Custom Message (Toggle) -->
        <div id="custom-message-container" class="w-full flex flex-col gap-2 hidden">
            <div class="flex justify-between items-center px-1">
                <div class="flex items-center gap-2">
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="custom-toggle" class="sr-only peer"

                        <div
                            class="w-8 h-4 bg-gray-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-3 after:w-3 after:transition-all peer-checked:bg-rose-400">
                        </div>

            </div>
            <textarea id="custom-message-input" rows="3" class="setup-input resize-none hidden opacity-50" disabled

        </div>


        <div class="mt-auto w-full pt-6">
            <div class="flex gap-3">
                <button id="preview-btn" onclick="previewMessage()"
                    class="flex-1 py-4 bg-rose-100 text-rose-600 rounded-full text-xs tracking-[0.2em] uppercase font-bold shadow-md transition transform active:scale-95 border border-rose-200">

            </div>

            <div id="result-container" class="hidden flex flex-col gap-4 w-full mt-4 items-center">
                <input type="text" id="share-link-input" readonly
                    class="w-full text-center text-rose-500 text-sm border border-rose-200 rounded-lg py-3 px-4 bg-rose-50 focus:outline-none select-all"
                    value="">
                <button id="copy-link-btn"
                    class="w-full text-xs tracking-[0.2em] uppercase bg-rose-500 text-white py-3 rounded-lg hover:bg-rose-600 transition shadow-md">
                    Copy Link 📋

            </div>

            <p id="copy-status" class="text-[10px] text-rose-500 font-bold uppercase tracking-widest opacity-0 mt-2">

                    Built by Richard

            </div>
        </div>
    </div>

    <div id="experience-wrapper" class="hidden relative z-10 w-full px-8 text-center">
        <!-- Back to Edit Button (Preview Only) -->

            ✕ Edit

        <div id="intro-view" class="flex flex-col items-center gap-12">
            <h1 class="text-5xl font-elegant italic font-light text-gray-800" id="intro-title"></h1>
            <p id="intro-subtitle" class="text-sm uppercase tracking-[0.2em] text-gray-400 mt-4 opacity-0"></p>
            <button id="read-btn"

        </div>

        <div id="question-view" class="hidden flex flex-col items-center gap-12 opacity-0">

            <div id="buttons-container" class="flex gap-10 w-full justify-center items-center" style="display:none">

            </div>
            <button id="next-msg-btn" class="text-[13px] tracking-[0.3em] uppercase text-rose-400 font-bold">Continue

        </div>

        <div id="success-view" class="hidden flex flex-col items-center gap-12 opacity-0">

            <div class="h-32 flex items-center justify-center">

            <button id="reply-btn"

            <button onclick="location.href=location.pathname"
                class="text-[10px] tracking-[0.3em] uppercase text-rose-400 border border-rose-100 px-6 py-2 rounded-full">Create
                Your Own</button>
        </div>
    </div>

            let url = "";

            // Base URL Logic
            let baseUrl = "https://valentilove.netlify.app";
            if (window.location.hostname.includes("netlify.app") || window.location.hostname.includes("localhost")) {
                baseUrl = window.location.origin + window.location.pathname;
            }

            if (id) {
                // Short Link Success
                url = `${baseUrl}?id=${id}`;
            } else {
                // Fallback to Encryption if DB fails
                console.warn("Falling back to encrypted URL");
                const encryptedParams = encryptData(data);
                url = `${baseUrl}?data=${encodeURIComponent(encryptedParams)}`;
            }

            // SHOW RESULT UI
            const input = document.getElementById('share-link-input');
            const resultContainer = document.getElementById('result-container');
            const copyBtn = document.getElementById('copy-link-btn');

            input.value = url;
            resultContainer.classList.remove('hidden');
            btn.classList.add('hidden'); // Hide "Generate" button

            // Manual Copy Logic
            copyBtn.onclick = () => {
                navigator.clipboard.writeText(url).then(() => {
                    const status = document.getElementById('copy-status');
                    status.innerText = "Link Copied! Send it now.";
                    status.style.opacity = 1;
                    copyBtn.innerText = "Copied! ✅";
                    setTimeout(() => {
                        copyBtn.innerText = "Copy Link 📋";
                        status.style.opacity = 0;
                    }, 2000);
                }).catch(err => {
                    console.error("Clipboard failed", err);
                    input.select();
                    document.execCommand('copy'); // Fallback
                    alert("Copied to clipboard!");
                });
            };

            // Try Auto-Copy (Best Effort)
            navigator.clipboard.writeText(url).then(() => {
                const status = document.getElementById('copy-status');
                status.innerText = "Link Copied! Send it now.";
                status.style.opacity = 1;
                copyBtn.innerText = "Copied! ✅";
            }).catch(err => {
                console.warn("Auto-copy blocked (expected)", err);
                // No alert needed, user sees the button
            });

            // Reset Generate Button
            btn.innerText = originalText;
            btn.disabled = false;
        }



        function startExperience() {
            document.getElementById('setup-view').classList.add('hidden');
            document.getElementById('experience-wrapper').classList.remove('hidden');

            // Premium & Sweet & Spark Logic
            // Premium & Sweet & Spark Logic
            if (config.tier === 'heavy') {
                document.body.classList.add('premium-mode');
                document.getElementById('intro-title').classList.add('text-shimmer'); // Add shimmer
                const genderData = themes[config.type].messages[config.gender] || themes[config.type].messages['her'];
                if (config.sender && !genderData.success.includes(`Love, ${config.sender}`)) {
                    genderData.success = [...genderData.success, `Love, ${config.sender}`];
                }
            } else if (config.tier === 'sweet') {
                document.body.classList.add('sweet-mode');
                document.getElementById('intro-title').classList.add('text-pulse'); // Add pulse
            } else if (config.tier === 'basic') {
                document.body.classList.add('spark-mode');
            }

            typeWriter('intro-title', `A note for ${config.name}.`);

            if (config.sender) {
                const sub = document.getElementById('intro-subtitle');
                sub.innerText = `FROM ${config.sender}`;
                sub.classList.remove('opacity-0');
                anime({ targets: '#intro-subtitle', opacity: 1, delay: 1000, duration: 1000 });
            }

            // Reply Button Logic
            if (config.senderPhone) {
                const btn = document.getElementById('reply-btn');
                btn.classList.remove('hidden');
                btn.onclick = () => {
                    const text = `Yes! I will be your Valentine... 💖`;
                    window.open(`https://wa.me/${config.senderPhone}?text=${encodeURIComponent(text)}`, '_blank');
                };
            }

            // Set music based on theme
            const audio = document.getElementById('bg-music');
            audio.src = themes[config.type].music;
            audio.load();
        }

        document.getElementById('read-btn').onclick = () => {
            document.getElementById('bg-music').play().catch(() => { console.log('Autoplay blocked'); });
            anime({
                targets: '#intro-view', opacity: 0, duration: 600, complete: () => {
                    document.getElementById('intro-view').classList.add('hidden');
                    document.getElementById('question-view').classList.remove('hidden');
                    showNext();
                    anime({ targets: '#question-view', opacity: 1, translateY: [20, 0], duration: 800 });
                }
            });
        };

        function showNext() {
            let message = "";

            // Use pre-defined messages for other tiers
            // Check for Custom Messages first
            let list;
            if (config.customMessages && config.customMessages.length > 0) {
                list = config.customMessages;
            } else {
                // Fallback to 'her' if gender is missing (legacy safety)
                const genderData = themes[config.type].messages[config.gender] || themes[config.type].messages['her'];
                list = genderData.tiers[config.tier];
            }

            // Safety check if tier doesn't exist (e.g. heavy removed from some)
            if (!list) {
                console.error("Tier missing for this gender/type combination");
                return;
            }

            message = list[msgIndex];
            typeWriter('question-text', message, 50);

            // Show buttons on last message for pre-defined tiers
            if (msgIndex === list.length - 1) {
                document.getElementById('next-msg-btn').classList.add('hidden');
                document.getElementById('buttons-container').style.display = 'flex';
            }
        }

        // New Typewriter Helper with Cursor
        function typeWriter(elementId, text, speed = 50) {
            const element = document.getElementById(elementId);
            element.innerHTML = '<span class="cursor"></span>'; // Start with cursor
            let i = 0;

            function type() {
                if (i < text.length) {
                    element.innerHTML = text.substring(0, i + 1) + '<span class="cursor"></span>';
                    i++;
                    setTimeout(type, speed);
                } else {
                    element.innerHTML = text; // Remove cursor at end
                }
            }
            type();
        }

        document.getElementById('next-msg-btn').onclick = () => {
            msgIndex++; showNext();
        };

        document.getElementById('no-btn').onclick = function () {
            const yes = document.getElementById('yes-btn');
            let currentScale = parseFloat(yes.style.transform.replace('scale(', '').replace(')', '')) || 1;
            yes.style.transform = `scale(${currentScale + 0.5})`;
            if (currentScale > 3.5) this.classList.add('hidden');
        };

        document.getElementById('yes-btn').onclick = () => {
            const overlay = document.getElementById('petal-overlay');
            let emojis = themes[config.type].emojis;

            // Premium Emojis
            if (config.tier === 'heavy') {
                emojis = ['✨', '🌟', '💛', '🏵️', '👑'];
            }

            for (let i = 0; i < 100; i++) {
                const p = document.createElement('div');
                p.className = 'overlay-petal w-full h-full flex items-center justify-center text-4xl';
                p.innerHTML = emojis[Math.floor(Math.random() * emojis.length)];
                p.style.background = 'transparent'; // Remove background color
                overlay.appendChild(p);
            }

            // Confetti Explosion
            confetti({
                particleCount: 150,
                spread: 100,
                origin: { y: 0.6 },
                colors: ['#FF69B4', '#FF1493', '#D4AF37'], // Pink, Deep Pink, Gold
                shapes: ['circle', 'square'],
                scalar: 1.2
            });

            anime({
                targets: '.overlay-petal', scale: [0, 1.2], opacity: [0, 1], duration: 800, delay: anime.stagger(15, { grid: [10, 10], from: 'center' }),
                complete: () => {
                    document.getElementById('question-view').classList.add('hidden');
                    document.getElementById('success-view').classList.remove('hidden');
                    document.getElementById('success-view').style.opacity = 1;
                    document.getElementById('final-message').innerText = `Tap the heart, ${config.name}...`;
                    anime({ targets: '#petal-overlay', opacity: 0, duration: 800, delay: 400, complete: () => document.getElementById('petal-overlay').classList.add('hidden') });
                }
            });
        };

        document.getElementById('heart-trigger').onclick = () => {
            const genderData = themes[config.type].messages[config.gender] || themes[config.type].messages['her'];
            const list = genderData.success;
            const msgEl = document.getElementById('final-message');
            anime({ targets: '#heart-trigger', scale: [1, 1.3, 1], duration: 400 });
            for (let i = 0; i < 5; i++) createPetal(); // Increased count for effect
            anime({
                targets: msgEl, opacity: 0, duration: 300, complete: () => {
                    msgEl.innerText = list[flowIndex];
                    flowIndex = (flowIndex + 1) % list.length;
                    anime({ targets: msgEl, opacity: 1, duration: 600 });
                }
            });
        };

        let msgIndex = 0, flowIndex = 0;
        function createPetal() {
            const petal = document.createElement('div');
            let emojis = themes[config.type].emojis || ['🌸', '🌹'];

            if (config.tier === 'heavy') {
                emojis = ['✨', '🌟', '💛', '🏵️', '👑'];
            } else if (config.tier === 'sweet') {
                emojis = ['❤️', '💖', '💝', '💕', '💓'];
            } else if (config.tier === 'basic') {
                emojis = ['🔥', '❤️', '✨', '⚡'];
            }

            petal.innerHTML = emojis[Math.floor(Math.random() * emojis.length)];
            petal.style.position = 'fixed';
            petal.style.top = '-50px';
            petal.style.left = Math.random() * 100 + 'vw';
            petal.style.fontSize = (Math.random() * 15 + 10) + 'px';
            petal.style.zIndex = Math.random() > 0.5 ? '5' : '30';
            petal.style.pointerEvents = 'none';
            petal.style.userSelect = 'none';
            petal.style.opacity = Math.random() * 0.5 + 0.3;

            document.body.appendChild(petal);

            // Sweet Mode Animation Override (Float Up)
            if (config.tier === 'sweet') {
                anime({
                    targets: petal,
                    translateY: ['110vh', '-10vh'],
                    translateX: {
                        value: () => (Math.random() - 0.5) * 400,
                        duration: 8000
                    },
                    scale: [0.5, 1.5],
                    opacity: [0, 1, 0],
                    duration: Math.random() * 5000 + 8000,
                    easing: 'linear',
                    complete: () => petal.remove()
                });
            } else {
                anime({
                    targets: petal,
                    translateY: '110vh',
                    translateX: [
                        { value: (Math.random() - 0.5) * 200, duration: 4000, easing: 'easeInOutSine' },
                        { value: (Math.random() - 0.5) * 200, duration: 4000, easing: 'easeInOutSine' }
                    ],
                    rotateZ: {
                        value: Math.random() * 360,
                        duration: 8000,
                        easing: 'linear'
                    },
                    rotateX: {
                        value: Math.random() * 720,
                        duration: 5000,
                        easing: 'linear'
                    },
                    duration: Math.random() * 4000 + 6000,
                    easing: 'linear',
                    complete: () => petal.remove()
                });
            }
        }


        // --- PREVIEW LOGIC ---
        function previewMessage() {
            const name = document.getElementById('target-name').value;
            if (!name) { alert("Enter a name first!"); return; }



            config.name = name;
            config.sender = document.getElementById('sender-name').value;
            config.senderPhone = document.getElementById('sender-phone').value;
            // Config gender is already set by setGender()

            // Handle Custom Message
            const customText = document.getElementById('custom-message-input').value.trim();
            if (customText && config.tier !== 'free') {
                if (config.tier === 'basic') {
                    // Basic: Single string (one message)
                    config.customMessages = [customText];
                } else {
                    // Sweet/Heavy: Split by newlines or periods for flow
                    // Look for sentence endings (.!?) strictly followed by space or newline
                    config.customMessages = customText.split(/([.!?]+[\s\n]+)/).filter(Boolean).reduce((acc, part, i, arr) => {
                        if (i % 2 === 0) {
                            // This is the sentence part
                            let msg = part;
                            // Check next part if it's the delimiter
                            if (arr[i + 1]) msg += arr[i + 1].trim();
                            acc.push(msg.trim());
                        }
                        return acc;
                    }, []).filter(m => m.length > 0);

                    // Fallback if split failed or single line
                    if (config.customMessages.length === 0) config.customMessages = [customText];
                }
            } else {
                config.customMessages = null;
            }

            // Reset States
            msgIndex = 0;
            flowIndex = 0;

            // Show Back Button
            document.getElementById('back-to-edit-btn').classList.remove('hidden');

            // Hide buttons that shouldn't be in preview (like "Create Your Own")
            // We can keep them or hide them, let's keep them for realism but maybe disable?
            // Actually, let's just show the experience.

            startExperience();
        }

        function endPreview() {
            // Stop Music
            const audio = document.getElementById('bg-music');
            audio.pause();
            audio.currentTime = 0;

            // Reset UI
            document.getElementById('experience-wrapper').classList.add('hidden');
            document.getElementById('setup-view').classList.remove('hidden');

            // Reset Experience Views
            document.getElementById('intro-view').classList.remove('hidden');
            document.getElementById('intro-view').style.opacity = 1;
            document.getElementById('question-view').classList.add('hidden');
            document.getElementById('question-view').style.opacity = 0;
            document.getElementById('success-view').classList.add('hidden');
            document.getElementById('success-view').style.opacity = 0;
            document.getElementById('petal-overlay').classList.remove('hidden'); // Reset overlay visibility for next time
            document.getElementById('petal-overlay').innerHTML = ''; // Clear petals
            document.getElementById('petal-overlay').style.opacity = 1;

            // Remove classes
            document.body.classList.remove('premium-mode', 'sweet-mode', 'spark-mode');

            // Reset Text
            document.getElementById('intro-subtitle').style.opacity = 0;

            // Reset Yes Button Scale
            document.getElementById('yes-btn').style.transform = 'scale(1)';
            document.getElementById('no-btn').classList.remove('hidden');

            // Reset Next/Yes/No button visibility for next preview
            document.getElementById('next-msg-btn').classList.remove('hidden');
            document.getElementById('buttons-container').style.display = 'none';

            // Reset message indices
            msgIndex = 0;
            flowIndex = 0;
        }

        setInterval(createPetal, 600);

        function updateCharCount(input) {
            const limit = input.maxLength;
            const current = input.value.length;
            document.getElementById('custom-chars').innerText = `${current}/${limit}`;
        }

        function toggleCustomMessage(toggle) {
            const textarea = document.getElementById('custom-message-input');
            const charCount = document.getElementById('custom-chars');
            if (toggle.checked) {
                textarea.classList.remove('hidden', 'opacity-50');
                textarea.disabled = false;
                charCount.classList.remove('hidden');
                textarea.focus();
            } else {
                textarea.classList.add('hidden', 'opacity-50');
                textarea.disabled = true;
                textarea.value = '';
                charCount.classList.add('hidden');
            }
        }
    </script>
