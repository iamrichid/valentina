<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OdoFlow | The Love Lab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,300;1,500;1,600&family=Montserrat:wght@300;400;500;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --rose-primary: #FB7185;
            --rose-soft: #FFF9F9;
            --text-main: #1A1A1A;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--rose-soft);
            color: var(--text-main);
            margin: 0;
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .font-elegant {
            font-family: 'Cormorant Garamond', serif;
        }

        .setup-input {
            background: transparent;
            border-bottom: 2px solid #E5E5E5;
            padding: 12px 0;
            outline: none;
            font-family: 'Cormorant Garamond', serif;
            font-size: 2rem;
            width: 100%;
            text-align: center;
        }

        .btn-choice {
            padding: 10px 16px;
            border: 1px solid #E5E5E5;
            border-radius: 50px;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            transition: 0.3s;
        }

        .btn-choice.active {
            background: var(--rose-primary);
            color: white;
            border-color: var(--rose-primary);
        }

        .price-btn {
            padding: 10px;
            border: 2px solid #EEE;
            border-radius: 12px;
            transition: 0.3s;
            width: 100%;
            text-align: center;
            background: white;
        }

        .price-btn.active {
            border-color: var(--rose-primary);
            background: #FFF1F2;
        }

        #heart-trigger {
            font-size: 6.5rem;
            cursor: pointer;
            filter: drop-shadow(0 0 15px rgba(251, 113, 133, 0.4));
            position: relative;
            z-index: 50;
        }

        .falling-petal {
            position: fixed;
            top: -5vh;
            pointer-events: none;
            z-index: 1;
            animation: fall linear forwards;
            opacity: 0.6;
        }

        @keyframes fall {
            to {
                transform: translateY(105vh) rotate(360deg);
            }
        }

        #petal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            grid-template-rows: repeat(10, 1fr);
        }

        .overlay-petal {
            background: var(--rose-primary);
            border-radius: 50% 0 50% 50%;
            opacity: 0;
        }

        .hidden {
            display: none !important;
        }

        .lyrics-text {
            font-size: 2.2rem;
            line-height: 1.4;
            color: #2D2D2D;
            padding: 0 20px;
        }

        @media (max-width: 640px) {
            .lyrics-text {
                font-size: 1.8rem;
            }
        }

        /* Add this to your <style> section */
        .falling-petal {
            filter: drop-shadow(0 0 5px rgba(251, 113, 133, 0.2));
        }

        /* Optional: Blur petals that are 'further away' */
        div[style*="z-index: 5"] {
            filter: blur(1px) opacity(0.4);
        }

        #momo-modal {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
        }

        .admin-mode .price-btn.active {
            background: #dcfce7 !important;
            /* Green for admin */
            border-color: #22c55e !important;
        }

        .admin-mode #action-btn {
            background: #22c55e !important;
        }

        /* PREMIUM GOLD THEME */
        .premium-mode {
            --rose-primary: #D4AF37;
            /* Gold */
            --rose-soft: #FFFBF0;
            /* Creamy Gold */
            background: linear-gradient(135deg, #FFFBF0 0%, #FFF5D6 100%);
        }

        .premium-mode .text-rose-500,
        .premium-mode .text-rose-400 {
            color: #D4AF37 !important;
        }

        .premium-mode #read-btn {
            border-color: #D4AF37 !important;
        }

        .premium-mode .overlay-petal {
            background: #D4AF37 !important;
        }
    </style>
</head>

<body>

    <div id="petal-overlay"></div>
    <audio id="bg-music" loop>
        <source src="https://www.bensound.com/bensound-music/bensound-love.mp3" type="audio/mpeg">
    </audio>

    <div id="setup-view"
        class="z-20 w-full max-w-sm px-8 flex flex-col gap-8 text-center bg-white py-10 rounded-[2rem] shadow-sm mx-4 overflow-y-auto max-h-[90vh]">
        <div class="flex flex-col items-center gap-2">
            <h1 class="text-3xl font-elegant italic font-bold text-rose-500">OdoFlow</h1>
            <p class="text-[9px] uppercase tracking-[0.4em] text-gray-400">The Love Lab</p>
        </div>

        <input type="text" id="target-name" class="setup-input" placeholder="Their Name">
        <input type="text" id="sender-name" class="setup-input" placeholder="Your Name (Optional)"
            style="font-size: 1.5rem;">
        <input type="text" id="secret-msg" class="setup-input text-base" placeholder="Secret P.S. (Optional)"
            style="font-size: 1.2rem;">

        <div class="flex flex-col gap-3 text-left">
            <p class="text-[9px] uppercase tracking-widest text-gray-400 font-bold ml-2">Relationship</p>
            <div class="flex flex-wrap justify-center gap-2">
                <button onclick="setRel('lover')" id="rel-lover" class="btn-choice active">Lover</button>
                <button onclick="setRel('crush')" id="rel-crush" class="btn-choice">Crush</button>
                <button onclick="setRel('parent')" id="rel-parent" class="btn-choice">Parent</button>
                <button onclick="setRel('sibling')" id="rel-sibling" class="btn-choice">Sibling</button>
                <button onclick="setRel('friend')" id="rel-friend" class="btn-choice">Friend</button>
                <button onclick="setRel('enemy')" id="rel-enemy" class="btn-choice">Enemy</button>
            </div>
        </div>

        <div class="flex flex-col gap-3 text-left">
            <p class="text-[9px] uppercase tracking-widest text-gray-400 font-bold ml-2">Tier</p>
            <div class="grid grid-cols-4 gap-2">
                <button onclick="setPrice(0)" id="p-0" class="price-btn active"><span
                        class="block text-xs font-bold">₵0</span><span class="text-[7px] uppercase">Free</span></button>
                <button onclick="setPrice(2)" id="p-2" class="price-btn"><span
                        class="block text-xs font-bold">₵2</span><span
                        class="text-[7px] uppercase">Basic</span></button>
                <button onclick="setPrice(5)" id="p-5" class="price-btn"><span
                        class="block text-xs font-bold">₵5</span><span
                        class="text-[7px] uppercase">Sweet</span></button>
                <button onclick="setPrice(10)" id="p-10" class="price-btn"><span
                        class="block text-xs font-bold">₵10</span><span
                        class="text-[7px] uppercase">Heavy</span></button>
            </div>
        </div>



        <button id="action-btn"
            class="py-5 bg-black text-white rounded-full text-[10px] tracking-[0.4em] uppercase font-bold shadow-xl">Generate
            Free Link</button>
        <p id="copy-status" class="text-[10px] text-rose-500 font-bold uppercase tracking-widest opacity-0">Link Copied!
            Send it now.</p>
    </div>

    <div id="experience-wrapper" class="hidden relative z-10 w-full px-8 text-center">
        <div id="intro-view" class="flex flex-col items-center gap-12">
            <h1 class="text-5xl font-elegant italic font-light text-gray-800" id="intro-title"></h1>
            <p id="intro-subtitle" class="text-sm uppercase tracking-[0.2em] text-gray-400 mt-4 opacity-0"></p>
            <button id="read-btn"
                class="text-[12px] tracking-[0.4em] uppercase border-b-2 border-rose-300 pb-2 text-rose-500 font-bold">Open
                Note</button>
        </div>

        <div id="question-view" class="hidden flex flex-col items-center gap-12 opacity-0">
            <h1 id="question-text"
                class="lyrics-text font-elegant italic font-medium min-h-[180px] flex items-center justify-center"></h1>
            <div id="buttons-container" class="hidden flex gap-10 w-full justify-center items-center">
                <button id="yes-btn"
                    class="text-[16px] tracking-[0.2em] uppercase text-rose-500 font-black">Yes</button>
                <button id="no-btn" class="text-[14px] tracking-[0.2em] uppercase text-gray-300">No</button>
            </div>
            <button id="next-msg-btn" class="text-[13px] tracking-[0.3em] uppercase text-rose-400 font-bold">Continue
                →</button>
        </div>

        <div id="success-view" class="hidden flex flex-col items-center gap-12 opacity-0">
            <div id="heart-trigger">❤️</div>
            <div class="h-32 flex items-center justify-center">
                <p id="final-message" class="text-3xl font-elegant italic text-gray-700 px-2"></p>
            </div>
            <button onclick="location.href=location.pathname"
                class="text-[10px] tracking-[0.3em] uppercase text-rose-400 border border-rose-100 px-6 py-2 rounded-full">Create
                Your Own</button>
        </div>
    </div>

    <!-- MoMo Modal -->
    <div id="momo-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center px-4">
        <div class="bg-white rounded-3xl p-8 max-w-sm w-full text-center shadow-2xl animate-[fadeIn_0.3s_ease-out]">
            <h3 class="text-2xl font-elegant italic font-bold mb-6 text-gray-800">Pay with MoMo</h3>

            <div class="bg-gray-50 rounded-xl p-4 mb-6 text-left border border-gray-100">
                <p class="text-[10px] uppercase text-gray-400 font-bold tracking-widest mb-1">Send To</p>
                <p class="font-bold text-lg text-gray-800">059 279 7074</p>
                <p class="text-xs text-gray-500 mb-4">Name: Richard</p>

                <p class="text-[10px] uppercase text-gray-400 font-bold tracking-widest mb-1">Amount</p>
                <p class="font-bold text-lg text-rose-500" id="modal-amount">₵0</p>
            </div>

            <p class="text-xs text-gray-500 mb-6 px-4">
                After sending, click below to confirm via WhatsApp. I will send your link immediately.
            </p>

            <button onclick="sendToWhatsApp()"
                class="w-full py-4 bg-[#25D366] text-white rounded-full text-[11px] font-bold uppercase tracking-[0.2em] shadow-lg mb-3">
                Confirm on WhatsApp
            </button>

            <button onclick="document.getElementById('momo-modal').classList.add('hidden')"
                class="text-[10px] text-gray-400 uppercase tracking-widest hover:text-gray-600">
                Cancel
            </button>
        </div>
    </div>

    <script>
        const themes = {
            lover: {
                tiers: {

                },
                success: ["You are my blessing.", "You are my home.", "Forever yours.", "I love you truly."],
                emojis: ['🌸', '🌹', '❤️', '💕'],
                music: "https://www.bensound.com/bensound-music/bensound-love.mp3"
            },
            crush: {
                tiers: {
                    free: ["I’ve been shy to say this...", "Every time I see you, my heart skip beat.", "You be the only vibe I’m feeling lately.", "Could we be more than friends?", "Will you be my Valentine?"],
                    basic: ["I smile at my phone when it's you.", "I think about you more than you know.", "You make ordinary days special.", "I really, really like you.", "Will you be my Valentine?"],
                    sweet: ["You are the crush that never faded.", "I want to be the reason you smile.", "Let's stop pretending we're just friends.", "You have my heart already.", "Can I take you out?"],
                    heavy: ["I am falling for you, hard.", "You remain the most beautiful mystery.", "I want to know every part of you.", "My heart chooses you, every time.", "Be mine, please?"]
                },
                success: ["I'm glad I said it.", "You make me smile.", "Let's see where this goes.", "You're special."],
                emojis: ['😍', '👀', '✨', '💌'],
                music: "https://www.bensound.com/bensound-music/bensound-love.mp3"
            },
            parent: {
                tiers: {
                    free: ["Everything I am is because of you.", "God really blessed me with the best.", "Thank you for the sacrifices I didn't see.", "Your prayers keep me going every day.", "Can I tell you I love you today?"],
                    basic: ["You taught me what love really means.", "Thank you for being my rock.", "I appreciate you more as I grow.", "You are appreciated.", "I love you!"],
                    sweet: ["Home is wherever you are.", "Your wisdom guides my every step.", "I am so proud to be your child.", "May God bless you abundantly.", "Love you always."],
                    heavy: ["You gave me life and taught me to live.", "I owe you everything good in me.", "Your love is the purest I know.", "I will always take care of you.", "I love you deeply."]
                },
                success: ["You are my hero.", "God bless you always.", "The real GOAT.", "I appreciate you."],
                emojis: ['👑', '🛡️', '💐', '🏡'],
                music: "https://www.bensound.com/bensound-music/bensound-love.mp3"
            },
            sibling: {
                tiers: {
                    free: ["You’re annoying, but you're my person.", "I'd still share my last plantain with you.", "The best partner-in-crime since day one.", "Thanks for not telling Mom all my secrets.", "You know I love you, right?"],
                    basic: ["We fight, we make up, we ride.", "Life is better with you in it.", "You're my first best friend.", "Thanks for having my back.", "Love you, nuisance."],
                    sweet: ["You know me better than anyone.", "I'm lucky to grow up with you.", "My favorite person to disturb.", "Always here for you.", "Love you!"],
                    heavy: ["Blood makes us relatives, love makes us friends.", "I'd do anything for you.", "You are my keeper.", "Forever my partner in crime.", "Love you deep."]
                },
                success: ["Blood is thicker than water.", "Siblings by birth, friends by choice.", "Always my favorite person to annoy.", "Got your back forever."],
                emojis: ['🎮', '🍕', '🤪', '🤛'],
                music: "https://www.bensound.com/bensound-music/bensound-funny.mp3"
            },
            friend: {
                tiers: {
                    free: ["Real ones are hard to find.", "Glad we're on the same vibe.", "Thank you for being there.", "You make life much more fun.", "Will you be my Bestie forever?"],
                    basic: ["Thanks for being a real one.", "Vibes on vibes with you.", "You make the tough days easier.", "Cheers to us.", "Besties 4L?"],
                    sweet: ["You are the family I chose.", "Life is boring without you.", "Thanks for being my listener.", "You're a rare gem.", "Love you friend!"],
                    heavy: ["I don't know where I'd be without you.", "You saved me in ways you don't know.", "A true friend is a blessing.", "Forever grateful for you.", "Love you deep."]
                },
                success: ["Friends for life.", "Always got your back.", "To many more vibes.", "You're a gem."],
                emojis: ['🥂', '🤝', '🌟', '👯'],
                music: "https://www.bensound.com/bensound-music/bensound-energy.mp3"
            },
            enemy: {
                tiers: {
                    free: ["I know you dey watch me like DSTV.", "Your eye-red no fit stop my grace.", "Even Shatta Wale say: 'My enemies shame.'", "I'm the one God blessed. Agree?"],
                    basic: ["Keep watching, the show just started.", "Validation? I don't need yours.", "I'm busy winning.", "Grace is natural.", "Bye!"],
                    sweet: ["I actually pray for you.", "Hope you find peace.", "No bad vibes here.", "Bless up.", " Peace."],
                    heavy: ["I forgive you.", "Let's leave the hate behind.", "Life is too short.", "I wish you well.", "God bless."]
                },
                success: ["Victory is mine.", "Keep watching the glory.", "Psalm 23:5 always."],
                emojis: ['🐍', '🤡', '🚩', '💣'],
                music: "https://www.bensound.com/bensound-music/bensound-epic.mp3"
            }
        };
        let config = { name: "", sender: "", type: "lover", tier: "free", amount: 0 };
        let isAdmin = false;

        const SECRET_KEY = "OdoFlow_Val_2026_Secret"; // Simple obfuscation key

        window.onload = () => {
            const params = new URLSearchParams(window.location.search);

            // 1. Try to decrypt 'data' param first
            if (params.has('data')) {
                const decrypted = decryptData(params.get('data'));
                if (decrypted) {
                    config = { ...config, ...decrypted };
                    startExperience();
                }
            }
            // 2. Fallback to legacy params (name, type, tier)
            else if (params.has('name')) {
                config.name = params.get('name');
                config.type = params.get('type') || 'lover';
                config.tier = params.get('tier') || 'free';
                startExperience();
            }

            // ADMIN ACCESS: Obfuscated Check
            // We hash the input and compare it to the known hash of the secret code.
            const adminInput = params.get('admin');
            // Hash of "richard"
            const secretHash = "61bffea9215f65164ad18b45aff1436c0c165d0d5dd2087ef61b4232ba6d2c1a";

            if (adminInput && CryptoJS.SHA256(adminInput).toString() === secretHash) {
                isAdmin = true;
                document.body.classList.add('admin-mode');
            }
            setInterval(createPetal, 450);
        };

        // --- ENCRYPTION HELPERS ---
        function encryptData(data) {
            try {
                return CryptoJS.AES.encrypt(JSON.stringify(data), SECRET_KEY).toString();
            } catch (e) { console.error("Encrypt Error", e); return null; }
        }

        function decryptData(ciphertext) {
            try {
                const bytes = CryptoJS.AES.decrypt(ciphertext, SECRET_KEY);
                return JSON.parse(bytes.toString(CryptoJS.enc.Utf8));
            } catch (e) { console.error("Decrypt Error", e); return null; }
        }

        function setRel(t) {
            config.type = t;
            document.querySelectorAll('.btn-choice').forEach(b => b.classList.remove('active'));
            document.getElementById(`rel-${t}`).classList.add('active');
        }

        function setPrice(amt) {
            config.amount = amt;
            // Map amount to tier
            if (amt === 0) config.tier = "free";
            else if (amt === 2) config.tier = "basic";
            else if (amt === 5) config.tier = "sweet";
            else if (amt === 10) config.tier = "heavy";

            document.querySelectorAll('.price-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`p-${amt}`).classList.add('active');

            const btn = document.getElementById('action-btn');

            if (isAdmin) {
                btn.innerText = `Generate Admin Link (${config.tier})`;
                return;
            }

            if (amt === 0) {
                btn.innerText = "Generate Free Link";
            } else {
                btn.innerText = `Pay ₵${amt} with MoMo`;
            }
        }

        document.getElementById('action-btn').onclick = () => {
            const name = document.getElementById('target-name').value;
            if (!name) { alert("Enter a name first!"); return; }

            if (isAdmin) {
                generateLink();
                return;
            }

            if (config.amount === 0) {
                generateLink();
            } else {
                openMoMoModal();
            }
        };

        function openMoMoModal() {
            document.getElementById('modal-amount').innerText = `₵${config.amount}`;
            document.getElementById('momo-modal').classList.remove('hidden');
        }

        function sendToWhatsApp() {
            // Update config with current inputs
            config.name = document.getElementById('target-name').value;
            config.sender = document.getElementById('sender-name').value;

            if (!config.name) { alert("Please enter a name first!"); return; }

            const myNumber = "233592797074"; // Your number
            let text = `Hi, I just sent ₵${config.amount} for a '${config.type}' note (${config.tier}) for ${config.name}.`;

            if (config.sender) {
                text += ` From: ${config.sender}.`;
            }

            text += ` Please activate my link.`;

            const url = `https://wa.me/${myNumber}?text=${encodeURIComponent(text)}`;
            window.open(url, '_blank');
        }

        function generateLink() {
            // Create data object
            const data = {
                name: document.getElementById('target-name').value,
                sender: document.getElementById('sender-name').value,
                type: config.type,
                tier: config.tier
            };

            // Encrypt it
            const encryptedParams = encryptData(data);

            // Base URL Strategy:
            // 1. If we are on ANY variant of Netlify (e.g. deploy preview or production), use THAT url.
            // 2. If we are on localhost or file://, force the LIVE production URL.
            let baseUrl = "https://valentilove.netlify.app";

            if (window.location.hostname.includes("netlify.app")) {
                baseUrl = window.location.origin + window.location.pathname;
            }

            const url = `${baseUrl}?data=${encodeURIComponent(encryptedParams)}`;

            navigator.clipboard.writeText(url).then(() => {
                const status = document.getElementById('copy-status');
                status.innerText = isAdmin ? "Admin Link Copied!" : "Link Copied! Send it now.";
                status.style.opacity = 1;
            }).catch(err => {
                console.error("Clipboard failed", err);
                prompt("Copy this link:", url);
            });
        }



        function startExperience() {
            document.getElementById('setup-view').classList.add('hidden');
            document.getElementById('experience-wrapper').classList.remove('hidden');

            // Premium Logic
            if (config.tier === 'heavy') {
                document.body.classList.add('premium-mode');

                // Add Sender signature to success messages if sender exists
                if (config.sender) {
                    themes[config.type].success.push(`Love, ${config.sender}`);
                }
            }

            typeWriter('intro-title', `A note for ${config.name}.`);

            if (config.sender) {
                const sub = document.getElementById('intro-subtitle');
                sub.innerText = `FROM ${config.sender}`;
                sub.classList.remove('opacity-0');
                anime({ targets: '#intro-subtitle', opacity: 1, delay: 1000, duration: 1000 });
            }

            // Set music based on theme
            const audio = document.getElementById('bg-music');
            audio.src = themes[config.type].music;
            audio.load();
        }

        document.getElementById('read-btn').onclick = () => {
            document.getElementById('bg-music').play().catch(() => { console.log('Autoplay blocked'); });
            anime({
                targets: '#intro-view', opacity: 0, duration: 600, complete: () => {
                    document.getElementById('intro-view').classList.add('hidden');
                    document.getElementById('question-view').classList.remove('hidden');
                    showNext();
                    anime({ targets: '#question-view', opacity: 1, translateY: [20, 0], duration: 800 });
                }
            });
        };

        function showNext() {
            const list = themes[config.type].tiers[config.tier];
            typeWriter('question-text', list[msgIndex], 50);

            if (msgIndex === list.length - 1) {
                document.getElementById('next-msg-btn').classList.add('hidden');
                document.getElementById('buttons-container').classList.remove('hidden');
            }
        }

        // New Typewriter Helper
        function typeWriter(elementId, text, speed = 50) {
            const element = document.getElementById(elementId);
            element.innerHTML = ''; // Clear content
            let i = 0;

            function type() {
                if (i < text.length) {
                    element.innerHTML += text.charAt(i);
                    i++;
                    setTimeout(type, speed);
                }
            }
            type();
        }

        document.getElementById('next-msg-btn').onclick = () => {
            msgIndex++; showNext();
        };

        document.getElementById('no-btn').onclick = function () {
            const yes = document.getElementById('yes-btn');
            let currentScale = parseFloat(yes.style.transform.replace('scale(', '').replace(')', '')) || 1;
            yes.style.transform = `scale(${currentScale + 0.5})`;
            if (currentScale > 3.5) this.classList.add('hidden');
        };

        document.getElementById('yes-btn').onclick = () => {
            const overlay = document.getElementById('petal-overlay');
            let emojis = themes[config.type].emojis;

            // Premium Emojis
            if (config.tier === 'heavy') {
                emojis = ['✨', '🌟', '💛', '🏵️', '👑'];
            }

            for (let i = 0; i < 100; i++) {
                const p = document.createElement('div');
                p.className = 'overlay-petal w-full h-full flex items-center justify-center text-4xl';
                p.innerHTML = emojis[Math.floor(Math.random() * emojis.length)];
                p.style.background = 'transparent'; // Remove background color
                overlay.appendChild(p);
            }
            anime({
                targets: '.overlay-petal', scale: [0, 1.2], opacity: [0, 1], duration: 800, delay: anime.stagger(15, { grid: [10, 10], from: 'center' }),
                complete: () => {
                    document.getElementById('question-view').classList.add('hidden');
                    document.getElementById('success-view').classList.remove('hidden');
                    document.getElementById('success-view').style.opacity = 1;
                    document.getElementById('final-message').innerText = `Tap the heart, ${config.name}...`;
                    anime({ targets: '#petal-overlay', opacity: 0, duration: 800, delay: 400, complete: () => document.getElementById('petal-overlay').classList.add('hidden') });
                }
            });
        };

        document.getElementById('heart-trigger').onclick = () => {
            const list = themes[config.type].success;
            const msgEl = document.getElementById('final-message');
            anime({ targets: '#heart-trigger', scale: [1, 1.3, 1], duration: 400 });
            for (let i = 0; i < 5; i++) createPetal(); // Increased count for effect
            anime({
                targets: msgEl, opacity: 0, duration: 300, complete: () => {
                    msgEl.innerText = list[flowIndex];
                    flowIndex = (flowIndex + 1) % list.length;
                    anime({ targets: msgEl, opacity: 1, duration: 600 });
                }
            });
        };

        let msgIndex = 0, flowIndex = 0;
        function createPetal() {
            const petal = document.createElement('div');
            let emojis = themes[config.type].emojis || ['🌸', '🌹'];

            if (config.tier === 'heavy') {
                emojis = ['✨', '🌟', '💛', '🏵️', '👑'];
            }

            petal.innerHTML = emojis[Math.floor(Math.random() * emojis.length)];
            petal.style.position = 'fixed';
            petal.style.top = '-50px';
            petal.style.left = Math.random() * 100 + 'vw';
            petal.style.fontSize = (Math.random() * 15 + 10) + 'px';
            petal.style.zIndex = Math.random() > 0.5 ? '5' : '30';
            petal.style.pointerEvents = 'none';
            petal.style.userSelect = 'none';
            petal.style.opacity = Math.random() * 0.5 + 0.3;

            document.body.appendChild(petal);

            anime({
                targets: petal,
                translateY: '110vh',
                translateX: [
                    { value: (Math.random() - 0.5) * 200, duration: 4000, easing: 'easeInOutSine' },
                    { value: (Math.random() - 0.5) * 200, duration: 4000, easing: 'easeInOutSine' }
                ],
                rotateZ: {
                    value: Math.random() * 360,
                    duration: 8000,
                    easing: 'linear'
                },
                rotateX: {
                    value: Math.random() * 720,
                    duration: 5000,
                    easing: 'linear'
                },
                duration: Math.random() * 4000 + 6000,
                easing: 'linear',
                complete: () => petal.remove()
            });
        }

        setInterval(createPetal, 600);
    </script>
</body>

</html>
