<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OdoFlow Admin | Generate Links</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #f3f4f6;
        }

        .hidden {
            display: none;
        }

        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }
    </style>
</head>

<body class="bg-gray-100 min-h-screen flex justify-center">

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="w-full max-w-md bg-white p-8 rounded-2xl shadow-xl text-center fade-in">
        <h1 class="text-2xl font-bold text-gray-800 mb-2">Admin Access</h1>
        <p class="text-sm text-gray-500 mb-6">Enter secure access code</p>

        <input type="password" id="access-code"
            class="w-full p-4 border rounded-xl mb-4 text-center text-lg tracking-widest outline-rose-500"
            placeholder="•••••••">

        <button onclick="checkAccess()"
            class="w-full bg-rose-500 text-white py-4 rounded-xl font-bold hover:bg-rose-600 transition">
            Unlock Dashboard
        </button>
        <p id="login-error" class="text-red-500 text-sm mt-4 hidden">Access Denied</p>
    </div>

    <!-- DASHBOARD SCREEN -->
    <div id="dashboard-screen" class="hidden w-full max-w-md bg-white min-h-screen shadow-2xl fade-in flex flex-col">
        <div class="p-6 border-b sticky top-0 bg-white z-10 flex justify-between items-center shadow-sm">
            <div class="flex flex-col">
                <h1 class="text-xl font-bold text-gray-800">Link Generator</h1>
                <p class="text-[10px] uppercase tracking-widest text-gray-400">OdoFlow Admin</p>
            </div>
            <button onclick="logout()"
                class="text-[10px] bg-rose-50 text-rose-500 px-3 py-1 rounded-full font-bold uppercase tracking-wider">Logout</button>
        </div>

        <div class="p-6 flex-1 flex flex-col gap-6">
            <!-- Inputs -->
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Target
                        Name</label>
                    <input type="text" id="target-name"
                        class="w-full p-3 border rounded-lg focus:border-rose-500 outline-none" placeholder="e.g. Ama">
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Sender Name
                        (Optional)</label>
                    <input type="text" id="sender-name"
                        class="w-full p-3 border rounded-lg focus:border-rose-500 outline-none" placeholder="e.g. Kofi">
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Sender WhatsApp
                        (For Reply)</label>
                    <input type="tel" id="sender-phone"
                        class="w-full p-3 border rounded-lg focus:border-rose-500 outline-none"
                        placeholder="e.g. 23354XXXXXXX">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label
                            class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Relation</label>
                        <select id="rel-type" class="w-full p-3 border rounded-lg bg-white outline-none">
                            <option value="lover">Lover</option>
                            <option value="crush">Crush</option>
                            <option value="parent">Parent</option>
                            <option value="sibling">Sibling</option>
                            <option value="friend">Friend</option>
                            <option value="enemy">Enemy</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Tier</label>
                        <select id="tier-level" class="w-full p-3 border rounded-lg bg-white outline-none">
                            <option value="free">Free (₵0)</option>
                            <option value="basic">Basic (₵2)</option>
                            <option value="sweet">Sweet (₵5)</option>
                            <option value="heavy">Heavy (₵10)</option>
                        </select>
                    </div>
                </div>

                <button onclick="generate()"
                    class="w-full bg-gray-900 text-white py-4 rounded-xl font-bold uppercase tracking-widest hover:bg-gray-800 transition shadow-lg">
                    Generate Link
                </button>
            </div>

            <!-- Output & Actions -->
            <div class="bg-gray-50 p-6 rounded-2xl border border-gray-100 flex flex-col gap-4">
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Generated
                        Link</label>
                    <textarea id="result-link" readonly
                        class="w-full h-24 p-3 text-xs font-mono bg-white border rounded-lg resize-none text-gray-500 focus:outline-none"
                        placeholder="Link will appear here..."></textarea>
                </div>

                <div class="space-y-3 mt-4">
                    <button onclick="copyLink()" id="copy-btn"
                        class="w-full border border-gray-300 py-3 rounded-lg text-sm font-bold text-gray-600 hover:bg-white transition">
                        Copy Link
                    </button>

                    <button onclick="sendWhatsApp()" id="whatsapp-btn"
                        class="w-full bg-[#25D366] text-white py-3 rounded-lg text-sm font-bold hover:bg-[#128C7E] transition opacity-50 cursor-not-allowed"
                        disabled>
                        Send via WhatsApp
                    </button>
                </div>
            </div>
        </div>

        <!-- History Section (Bottom) -->
        <div class="p-6 bg-gray-50 border-t mt-auto">
            <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-4">Recent Links</h3>
            <div id="history-list" class="space-y-2 text-sm text-gray-600">
                <p class="text-xs text-gray-400 italic">No history yet.</p>
            </div>
            <button onclick="clearHistory()"
                class="mt-4 text-[10px] text-gray-400 underline hover:text-red-500 w-full text-center py-2">Clear
                History</button>
        </div>

    </div>

    <script>
        // --- CONSTANTS ---
        const SECRET_HASH = "61bffea9215f65164ad18b45aff1436c0c165d0d5dd2087ef61b4232ba6d2c1a"; // SHA256 of "richard"
        const ENCRYPTION_KEY = "OdoFlow_Val_2026_Secret";
        const PRODUCTION_URL = "https://valentilove.netlify.app/";

        // --- AUTHENTICATION ---
        function checkAccess() {
            const input = document.getElementById('access-code').value;
            // Simple client-side hash check
            const hash = CryptoJS.SHA256(input).toString();

            if (hash === SECRET_HASH) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('dashboard-screen').classList.remove('hidden');
                loadHistory();
            } else {
                document.getElementById('login-error').classList.remove('hidden');
                document.getElementById('access-code').value = '';
                document.getElementById('access-code').focus();
            }
        }

        // Allow Enter key to submit login
        document.getElementById('access-code').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') checkAccess();
        });

        function logout() {
            location.reload();
        }

        // --- GENERATION LOGIC ---
        function generate() {
            const name = document.getElementById('target-name').value.trim();
            const sender = document.getElementById('sender-name').value.trim();
            const senderPhone = document.getElementById('sender-phone').value.trim();
            const type = document.getElementById('rel-type').value;
            const tier = document.getElementById('tier-level').value;

            if (!name) { alert("Please enter a Target Name."); return; }

            const data = { name, sender, senderPhone, type, tier };

            // Encrypt
            let encrypted = "";
            try {
                encrypted = CryptoJS.AES.encrypt(JSON.stringify(data), ENCRYPTION_KEY).toString();
            } catch (e) { console.error(e); alert("Encryption Error"); return; }

            const finalUrl = `${PRODUCTION_URL}?data=${encodeURIComponent(encrypted)}`;

            // Update UI
            document.getElementById('result-link').value = finalUrl;

            const waBtn = document.getElementById('whatsapp-btn');
            waBtn.disabled = false;
            waBtn.classList.remove('opacity-50', 'cursor-not-allowed');

            // Save to History
            addToHistory(name, sender, tier, finalUrl);
        }

        function copyLink() {
            const linkField = document.getElementById('result-link');
            if (!linkField.value) return;

            linkField.select();
            linkField.setSelectionRange(0, 99999);

            navigator.clipboard.writeText(linkField.value).then(() => {
                const btn = document.getElementById('copy-btn');
                const originalText = btn.innerText;
                btn.innerText = "Copied!";
                btn.classList.add('text-green-600', 'border-green-600');
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.classList.remove('text-green-600', 'border-green-600');
                }, 2000);
            }).catch(err => {
                prompt("Copy link manually:", linkField.value);
            });
        }

        function sendWhatsApp() {
            const link = document.getElementById('result-link').value;
            if (!link) return;

            const name = document.getElementById('target-name').value;
            const sender = document.getElementById('sender-name').value;

            let msg = `Hi ${name}! Here is a surprise Valentine note for you: ${link}`;
            if (sender) {
                msg = `Hi ${name}! ${sender} sent you a surprise Valentine note: ${link}`;
            }

            const waUrl = `https://wa.me/?text=${encodeURIComponent(msg)}`;
            window.open(waUrl, '_blank');
        }

        // --- HISTORY MANANGER ---
        function addToHistory(name, sender, tier, url) {
            let history = JSON.parse(localStorage.getItem('odo_admin_history') || '[]');

            const newItem = {
                id: Date.now(),
                name,
                sender,
                tier,
                url,
                date: new Date().toLocaleString()
            };

            // Add to top, limit to 10
            history.unshift(newItem);
            if (history.length > 10) history.pop();

            localStorage.setItem('odo_admin_history', JSON.stringify(history));
            loadHistory();
        }

        function loadHistory() {
            const list = document.getElementById('history-list');
            const history = JSON.parse(localStorage.getItem('odo_admin_history') || '[]');

            if (history.length === 0) {
                list.innerHTML = '<p class="text-xs text-gray-400 italic">No generated links yet.</p>';
                return;
            }

            list.innerHTML = history.map(item => `
                <div class="flex justify-between items-center bg-gray-50 p-3 rounded-lg border border-gray-100 hover:border-rose-200 transition">
                    <div>
                        <p class="font-bold text-gray-800">${item.name} <span class="font-normal text-gray-500">(${item.tier})</span></p>
                        <p class="text-[10px] text-gray-400">${item.sender ? 'From: ' + item.sender + ' • ' : ''}${item.date}</p>
                    </div>
                    <button onclick="copyHistoryLink('${item.url}')" class="text-xs text-rose-500 font-bold hover:underline">Copy</button>
                </div>
            `).join('');
        }

        function copyHistoryLink(url) {
            navigator.clipboard.writeText(url).then(() => alert("Link Copied!"));
        }

        function clearHistory() {
            if (confirm("Clear all history?")) {
                localStorage.removeItem('odo_admin_history');
                loadHistory();
            }
        }
    </script>
</body>

</html>
